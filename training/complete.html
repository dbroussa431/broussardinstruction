<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Completion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>Broussard Shooting Academy</h1>
    <p>Training Completed</p>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>Congratulations!</h2>
      <p>You have completed all lessons and passed the required quizzes. You are now a certified student of Broussard Shooting Academy.</p>
    </section>

    <section class="actions">
      <button id="logoutBtn">Logout</button>
    </section>
  </main>

  <script type="module">
    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("currentStudent");
      window.location.href = "index.html";
    };
  </script>
</body>
</html>
