<script>
  function show(el, text) {
    if (typeof text === "string") el.textContent = text;
    el.classList.remove("hidden");
  }

  function hide(el) {
    el.classList.add("hidden");
  }

  function validEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
  }

  function normalize(text) {
    return String(text || "").trim();
  }

  function looksLikeValidClientId(value) {
    const v = String(value || "").trim();
    if (!v) return false;
    if (v.includes("@")) return false;
    if (v.toLowerCase().includes("paypalme")) return false;
    if (v.toLowerCase().includes("sandbox") && !v.startsWith("A")) return true;
    return v.length > 20;
  }

  async function loadPayPalSdk(clientId, currency) {
    return new Promise((resolve, reject) => {
      const existing = document.querySelector('script[data-paypal-sdk="1"]');
      if (existing) existing.remove();

      const script = document.createElement("script");
      script.src =
        "https://www.paypal.com/sdk/js?client-id=" +
        encodeURIComponent(clientId) +
        "&currency=" +
        encodeURIComponent(currency || "USD");

      script.async = true;
      script.dataset.paypalSdk = "1";

      script.onload = () => resolve(script.src);
      script.onerror = (event) => reject(new Error("PayPal SDK failed to load: " + script.src));

      document.head.appendChild(script);
    });
  }

  async function initPurchase() {
    const cfg = window.BSA_PAY_CONFIG || {};
    const loadingNotice = document.getElementById("loadingNotice");
    const errorNotice = document.getElementById("errorNotice");
    const successNotice = document.getElementById("successNotice");
    const codeNotice = document.getElementById("codeNotice");
    const buyerName = document.getElementById("buyerName");
    const buyerEmail = document.getElementById("buyerEmail");
    const manualFallback = document.getElementById("manualFallback");
    const manualPayLink = document.getElementById("manualPayLink");

    manualPayLink.href = cfg.manualPayPalMeUrl || "https://www.paypal.com/paypalme/dbroussa431/150";

    hide(errorNotice);
    hide(successNotice);
    hide(codeNotice);
    show(loadingNotice, "Loading PayPal checkout…");

    if (
      !looksLikeValidClientId(cfg.paypalClientId) ||
      !cfg.createOrderUrl ||
      !cfg.captureOrderUrl
    ) {
      hide(loadingNotice);
      show(errorNotice, "Payment configuration is incomplete or invalid. Use the manual PayPal backup link below.");
      show(manualFallback);
      console.error("Invalid BSA_PAY_CONFIG:", cfg);
      return;
    }

    try {
      const sdkUrl = await loadPayPalSdk(cfg.paypalClientId, cfg.currency || "USD");
      console.log("Loaded PayPal SDK:", sdkUrl);
      hide(loadingNotice);

      if (!window.paypal || !window.paypal.Buttons) {
        show(errorNotice, "Unable to load PayPal checkout right now.");
        show(manualFallback);
        return;
      }

      window.paypal.Buttons({
        style: {
          layout: "vertical",
          color: "gold",
          shape: "rect",
          label: "paypal"
        },

        createOrder: async () => {
          hide(errorNotice);
          hide(successNotice);
          hide(codeNotice);

          const name = normalize(buyerName.value);
          const email = normalize(buyerEmail.value).toLowerCase();

          if (!name) {
            show(errorNotice, "Please enter your full name before checkout.");
            throw new Error("Missing buyer name");
          }

          if (!validEmail(email)) {
            show(errorNotice, "Please enter a valid email address before checkout.");
            throw new Error("Missing buyer email");
          }

          const response = await fetch(cfg.createOrderUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email })
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok || !data.orderID) {
            show(errorNotice, data.error || "Unable to create PayPal order.");
            show(manualFallback);
            throw new Error(data.error || "Unable to create PayPal order");
          }

          return data.orderID;
        },

        onApprove: async (data) => {
          hide(errorNotice);
          hide(successNotice);
          hide(codeNotice);
          show(loadingNotice, "Finalizing payment and generating your portal code…");

          const response = await fetch(cfg.captureOrderUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              orderID: data.orderID,
              name: normalize(buyerName.value),
              email: normalize(buyerEmail.value).toLowerCase()
            })
          });

          const result = await response.json().catch(() => ({}));

          hide(loadingNotice);

          if (!response.ok || !result.success) {
            show(errorNotice, result.error || "Payment was approved but code delivery failed. Contact Broussard Shooting Academy.");
            return;
          }

          show(
            successNotice,
            result.emailSent
              ? "Payment complete. Your access code has been emailed."
              : "Payment complete. Email delivery failed, but your access code is shown below."
          );

          show(codeNotice, "Your access code: " + result.accessCode);
        },

        onCancel: () => {
          hide(loadingNotice);
          show(errorNotice, "Checkout was cancelled.");
        },

        onError: (err) => {
          console.error("PayPal button error:", err);
          hide(loadingNotice);
          show(errorNotice, "Unable to load PayPal checkout right now.");
          show(manualFallback);
        }
      }).render("#paypal-button-container");
    } catch (error) {
      console.error("initPurchase error:", error);
      hide(loadingNotice);
      show(errorNotice, "Unable to load PayPal checkout right now.");
      show(manualFallback);
    }
  }

  initPurchase();
</script>
