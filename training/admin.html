<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSA Admin Dashboard</title>
<link rel="stylesheet" href="./styles.css">
</head>

<body>

<script>
// 🔒 ADMIN LOCK
if (localStorage.getItem("bsa_admin_auth") !== "true") {
  window.location.href = "admin-login.html";
}
</script>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="images/bsa-logo.png"></div>
      <div>
        <h1>BSA Admin Dashboard</h1>
        <p>
          Instructor: <strong>David A. Broussard, Sr.</strong><br>
          USCCA Instructor #: <strong>LSP Instructor No. 2274</strong>
        </p>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn btn-light" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<main class="container admin-page">

  <section class="panel">
    <h2>System Overview</h2>

    <div class="admin-stats-grid">
      <div class="admin-stat-card">
        <small>Total Students</small>
        <strong id="statTotal">0</strong>
      </div>

      <div class="admin-stat-card warning">
        <small>Pending Payments</small>
        <strong id="statPending">0</strong>
      </div>

      <div class="admin-stat-card success">
        <small>Passed Final</small>
        <strong id="statPassedFinal">0</strong>
      </div>

      <div class="admin-stat-card gold">
        <small>Critical Failures</small>
        <strong id="statCritical">0</strong>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Student Tracking</h2>

    <div class="table-scroll">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Progress</th>
            <th>Stage</th>
            <th>Attempts</th>
            <th>Final Result</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

</main>

<script type="module" src="admin.js"></script>

</body>
</html>
