<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Admin</title>
  <style>
    :root {
      --blue: #173f8a;
      --gold: #d4a11e;
      --bg: #eef3fb;
      --text: #1f2a44;
      --muted: #667085;
      --danger: #8f1d1d;
      --success: #176c2b;
      --card: #ffffff;
      --line: #e1e8f2;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #123c86 0%, #1d4ea2 260px, var(--bg) 260px);
      margin: 0;
      color: var(--text);
    }
    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 10px;
      color: #fff;
    }
    .topbar h1 { margin: 0 0 8px; font-size: 38px; }
    .topbar p { margin: 0; color: rgba(255,255,255,.9); }
    .admin-wrap {
      max-width: 1180px;
      margin: 18px auto 48px;
      padding: 0 20px;
    }
    .admin-card {
      background: var(--card);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(8, 29, 66, .12);
      margin-bottom: 22px;
      border: 1px solid rgba(255,255,255,.45);
    }
    h2 { margin: 0 0 16px; font-size: 24px; color: var(--blue); }
    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    input, select, button {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #ccd6e7;
      font-size: 16px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(23, 63, 138, .12);
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }
    button {
      background: var(--gold);
      color: #111;
      border: none;
      font-weight: 700;
      cursor: pointer;
      min-width: 190px;
    }
    .btn-secondary { background: var(--blue); color: #fff; }
    .btn-danger { background: #b93535; color: #fff; }
    button:hover { opacity: .95; }
    .result-box {
      margin-top: 14px;
      padding: 14px;
      background: #f8fafc;
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      font-weight: 700;
      white-space: pre-line;
    }
    .result-error { border-left-color: #b93535; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 14px;
      background: #fff;
      overflow: hidden;
    }
    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f7f9fd;
      color: var(--blue);
      position: sticky;
      top: 0;
    }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .paid { background: #d9f7df; color: var(--success); }
    .unpaid { background: #ffe2e2; color: var(--danger); }
    .muted { color: var(--muted); }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Broussard Shooting Academy Admin</h1>
    <p>Generate codes, mark students paid, unlock lesson attempts, and issue manual overrides.</p>
  </div>

  <div class="admin-wrap">
    <div class="admin-card">
      <h2>Create Student Code</h2>
      <div class="grid">
        <input id="studentName" placeholder="Student name" />
        <input id="studentEmail" placeholder="Student email" />
        <select id="studentTier">
          <option value="FULL">FULL - $150</option>
          <option value="DISC">DISC - $100</option>
          <option value="FREE">FREE - $0</option>
        </select>
        <select id="studentPaid">
          <option value="true">Paid</option>
          <option value="false">Unpaid</option>
        </select>
      </div>
      <div class="btn-row">
        <button id="createCodeBtn">Generate Student Code</button>
        <button id="refreshStudentsBtn" class="btn-secondary">Refresh Student List</button>
      </div>
      <div id="createResult" class="result-box" style="display:none;"></div>
    </div>

    <div class="admin-card">
      <h2>Unlock / Reset Student Lesson</h2>
      <div class="grid">
        <input id="unlockEmail" placeholder="Student email" />
        <input id="unlockLessonId" placeholder="Lesson ID (example: lesson1)" />
      </div>
      <div class="btn-row">
        <button id="unlockLessonBtn">Unlock Lesson</button>
        <button id="forceOverrideBtn" class="btn-secondary">Require Instructor Override</button>
        <button id="markPaidBtn">Mark Paid</button>
        <button id="issueNewCodeBtn" class="btn-danger">Issue New Code</button>
      </div>
      <div id="unlockResult" class="result-box" style="display:none;"></div>
    </div>

    <div class="admin-card">
      <h2>Students</h2>
      <div id="studentTableWrap" class="table-wrap"></div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
