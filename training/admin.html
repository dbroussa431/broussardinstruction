<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Training Admin</title>
  <link rel="stylesheet" href="css/portal.css" />
  <style>
    .admin-shell{max-width:1200px;margin:28px auto;padding:0 18px}
    .admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
    .admin-table-wrap{background:#fff;border-radius:18px;overflow:auto;box-shadow:0 14px 35px rgba(16,44,99,.12)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:14px 12px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:.95rem}
    th{background:#173f8a;color:#fff;position:sticky;top:0}
  </style>
</head>
<body class="portal-shell">
  <header class="portal-header">
    <img src="images/bsa-logo.png" alt="BSA Logo" />
    <div class="portal-header-title">
      <h1>Broussard Shooting Academy Training Admin</h1>
      <p>Paid / progress / completion / lock tracking</p>
    </div>
  </header>
  <main class="admin-shell">
    <div class="admin-stats">
      <div class="stat-card"><div class="stat-label">Students</div><div class="stat-value" id="adminCount">0</div></div>
      <div class="stat-card"><div class="stat-label">Paid or Discount</div><div class="stat-value" id="adminPaid">0</div></div>
      <div class="stat-card"><div class="stat-label">Online Complete</div><div class="stat-value" id="adminComplete">0</div></div>
    </div>
    <div class="admin-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Email</th>
            <th>Code</th>
            <th>Type</th>
            <th>Payment</th>
            <th>Current Section</th>
            <th>Lessons</th>
            <th>Lock Status</th>
            <th>Online Complete</th>
          </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
      </table>
    </div>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>renderAdmin();</script>
</body>
</html>
