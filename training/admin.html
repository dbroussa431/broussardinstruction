<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSA Admin Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner admin-wide">
      <div class="brand">
        <div class="brand-mark">
          <img src="images/bsa-logo.png" alt="BSA logo" onerror="this.src='logo.png'">
        </div>
        <div>
          <h1>BSA Admin Dashboard</h1>
          <p>Administrative tools and student access management</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container container-wide">
    <section class="panel content-card">
      <div class="section-head">
        <div>
          <h3>Admin Overview</h3>
          <p>This page loads the admin script and displays admin stats.</p>
        </div>
      </div>

      <div id="stats" class="admin-stats-box">Loading admin data...</div>
    </section>
  </main>

  <script type="module" src="./admin.js?v=1"></script>
</body>
</html>
