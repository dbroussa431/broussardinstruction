<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Training Portal Login</title>
  <link rel="stylesheet" href="css/portal.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-shell {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-sizing: border-box;
    }

    .login-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 28px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo-wrap img {
      width: 90px;
      height: auto;
      margin-bottom: 10px;
    }

    .logo-wrap h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    .logo-wrap p {
      margin: 0;
      color: #d1d5db;
      font-size: 0.95rem;
    }

    .field {
      margin-top: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .field input {
      width: 100%;
      padding: 14px 14px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid #94a3b8;
      outline: none;
      box-sizing: border-box;
      text-transform: uppercase;
    }

    .field input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56,189,248,0.25);
    }

    .login-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #f59e0b;
      color: #111827;
    }

    .login-btn:hover {
      filter: brightness(1.05);
    }

    .message {
      margin-top: 16px;
      font-size: 0.95rem;
      min-height: 22px;
    }

    .message.error {
      color: #fecaca;
    }

    .message.success {
      color: #bbf7d0;
    }

    .help-text {
      margin-top: 14px;
      font-size: 0.88rem;
      color: #cbd5e1;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="logo-wrap">
        <img src="images/bsa-logo.png" alt="Broussard Shooting Academy Logo">
        <h1>BSA Training Portal</h1>
        <p>Enter your student access code to continue</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="accessCode">Access Code</label>
          <input
            type="text"
            id="accessCode"
            name="accessCode"
            placeholder="BSA-FULL-1234"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            required
          />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Log In</button>
        <div id="message" class="message"></div>
      </form>

      <div class="help-text">
        Use the code you were given by Broussard Shooting Academy.
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
