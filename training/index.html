<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Training Portal Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b1220, #111827);
      color: white;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
    }
    h1 { margin: 0 0 8px; font-size: 1.45rem; }
    p { margin: 0 0 18px; color: #cbd5e1; }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #111827;
      color: white;
      outline: none;
      text-transform: uppercase;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56,189,248,0.18);
    }
    button {
      width: 100%;
      margin-top: 16px;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 800;
      background: #f59e0b;
      color: #111827;
      cursor: pointer;
    }
    .message {
      margin-top: 14px;
      min-height: 22px;
      font-size: 0.95rem;
    }
    .error { color: #fecaca; }
    .success { color: #bbf7d0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BSA Training Portal</h1>
    <p>Enter your access code to begin your training.</p>

    <form id="loginForm">
      <label for="accessCode">Access Code</label>
      <input id="accessCode" type="text" placeholder="BSA-FULL-1234" autocomplete="off" required />
      <button id="loginBtn" type="submit">Log In</button>
      <div id="message" class="message"></div>
    </form>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
