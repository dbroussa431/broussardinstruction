<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Student Portal Login</title>
  <link rel="stylesheet" href="./css/portal.css" />
</head>
<body class="portal-shell">
  <header class="portal-topbar">
    <div class="portal-brand">
      <h1>Broussard Shooting Academy</h1>
      <p>Student Training Portal Login</p>
    </div>
  </header>

  <main class="portal-login-page">
    <section class="portal-card login-card">
      <h2>Access Your Training</h2>
      <p class="login-help">
        Enter the access code generated by the instructor dashboard.
      </p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="accessCode">Access Code</label>
          <input
            type="text"
            id="accessCode"
            name="accessCode"
            placeholder="BSA-FREE-7555"
            autocomplete="off"
            required
          />
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">
          Login to Portal
        </button>

        <p id="loginMessage" class="form-message" aria-live="polite"></p>
      </form>

      <div class="portal-note">
        Your access code is created in the instructor admin dashboard. If you do
        not have one yet, contact Broussard Shooting Academy.
      </div>
    </section>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
