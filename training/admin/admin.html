<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Training Admin</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <header class="admin-topbar">
      <div class="brand-wrap">
        <div class="brand-dot"></div>
        <div>
          <h1>Admin Dashboard</h1>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="addStudentBtn" class="btn btn-gold" type="button">Add Student</button>
        <button id="refreshBtn" class="btn btn-dark" type="button">Refresh Records</button>
        <button id="exportBtn" class="btn btn-dark" type="button">Export CSV</button>
        <button id="logoutBtn" class="btn btn-danger" type="button">Logout</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="metrics-grid">
        <div class="metric-card">
          <div class="metric-head">
            <span>Total Students</span>
            <span id="metricStudentsSmall" class="metric-mini">0</span>
          </div>
          <div id="metricStudents" class="metric-big">0</div>
          <div class="metric-bar metric-bar-blue"></div>
        </div>

        <div class="metric-card metric-card-gold">
          <div class="metric-head">
            <span>Pending Payments</span>
            <span id="metricPendingSmall" class="metric-mini">0</span>
          </div>
          <div id="metricPending" class="metric-big">0</div>
          <div class="metric-bar metric-bar-gold"></div>
        </div>

        <div class="metric-card metric-card-green">
          <div class="metric-head">
            <span>Paid Students</span>
            <span id="metricPaidSmall" class="metric-mini">0</span>
          </div>
          <div id="metricPaid" class="metric-big">0</div>
          <div class="metric-bar metric-bar-green"></div>
        </div>

        <div class="metric-card metric-card-gold">
          <div class="metric-head">
            <span>Revenue Collected</span>
            <span id="metricRevenueSmall" class="metric-mini">$0</span>
          </div>
          <div id="metricRevenue" class="metric-big">$0</div>
          <div class="metric-bar metric-bar-gold"></div>
        </div>
      </section>

      <section class="quick-actions">
        <button id="quickAddBtn" class="btn btn-gold" type="button">Add Student</button>
        <button id="reloadBtn" class="btn btn-dark" type="button">Refresh Records</button>

        <div class="quick-filter-row">
          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Search by name, email, or code"
          />

          <select id="paymentFilter" class="filter-select">
            <option value="">Payment Statuses</option>
            <option value="Paid">Paid</option>
            <option value="Pending">Pending</option>
            <option value="Waived">Waived</option>
            <option value="Unpaid">Unpaid</option>
          </select>

          <select id="sortInput" class="filter-select">
            <option value="newest">Sort By</option>
            <option value="newest">Newest</option>
            <option value="name">Name</option>
            <option value="amountHigh">Highest Amount</option>
            <option value="amountLow">Lowest Amount</option>
            <option value="progressHigh">Highest Progress</option>
          </select>

          <button id="filterBtn" class="btn btn-brown" type="button">Filter</button>
        </div>
      </section>

      <section class="table-card">
        <div class="table-toolbar">
          <div class="toolbar-label">Search Records:</div>

          <input
            id="searchInput2"
            class="toolbar-input"
            type="text"
            placeholder="Search by name, email, or code"
          />

          <select id="paymentFilter2" class="toolbar-select">
            <option value="">All Payment Statuses</option>
            <option value="Paid">Paid</option>
            <option value="Pending">Pending</option>
            <option value="Waived">Waived</option>
            <option value="Unpaid">Unpaid</option>
          </select>

          <select id="portalFilter" class="toolbar-select">
            <option value="">All Portal Statuses</option>
            <option value="active">Active</option>
            <option value="locked">Locked</option>
            <option value="expired">Expired</option>
          </select>

          <select id="tierFilter" class="toolbar-select">
            <option value="">Sort By Tier</option>
            <option value="FREE">FREE</option>
            <option value="DISC">DISC</option>
            <option value="FULL">FULL</option>
          </select>

          <select id="sortInput2" class="toolbar-select">
            <option value="newest">Newest</option>
            <option value="name">Name</option>
            <option value="amountHigh">Highest Amount</option>
            <option value="amountLow">Lowest Amount</option>
            <option value="progressHigh">Highest Progress</option>
          </select>

          <button id="clearFiltersBtn" class="btn btn-light" type="button">Clear</button>
        </div>

        <div class="table-wrap">
          <table class="student-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Price</th>
                <th>Payment Method</th>
                <th>Payment Status</th>
                <th>Portal Status</th>
                <th>Progress Label</th>
                <th>Progress %</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="studentModalBackdrop" class="modal-backdrop hidden">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Add Student</h2>
      </div>

      <form id="studentForm" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" required />
          </div>

          <div class="field">
            <label for="studentEmail">Email</label>
            <input type="email" id="studentEmail" required />
          </div>

          <div class="field">
            <label for="priceTier">Course / Tier</label>
            <select id="priceTier">
              <option value="FULL">Louisiana Concealed Carry — FULL</option>
              <option value="DISC">Discounted Class — DISC</option>
              <option value="FREE">Free (Waived) — FREE</option>
            </select>
          </div>

          <div class="field">
            <label for="price">Price</label>
            <input type="number" id="price" min="0" step="1" />
          </div>

          <div class="field">
            <label for="paymentMethod">Payment Method</label>
            <select id="paymentMethod">
              <option value="Direct">Direct</option>
              <option value="PayPal">PayPal</option>
              <option value="Cash">Cash</option>
              <option value="Waived">Waived</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="paymentStatusSelect">Payment Status</label>
            <select id="paymentStatusSelect">
              <option value="Paid">Paid</option>
              <option value="Pending">Pending</option>
              <option value="Waived">Waived</option>
              <option value="Unpaid">Unpaid</option>
            </select>
          </div>

          <div class="field">
            <label for="portalStatus">Portal Status</label>
            <select id="portalStatus">
              <option value="active">Active</option>
              <option value="locked">Locked</option>
              <option value="expired">Expired</option>
            </select>
          </div>

          <div class="field">
            <label for="progressLabel">Progress Label</label>
            <select id="progressLabel">
              <option value="Not Started">Not Started</option>
              <option value="Lesson 1">Lesson 1</option>
              <option value="Lesson 2">Lesson 2</option>
              <option value="Lesson 3">Lesson 3</option>
              <option value="Lesson 4">Lesson 4</option>
              <option value="Lesson 5">Lesson 5</option>
              <option value="Lesson 6">Lesson 6</option>
              <option value="Lesson 7">Lesson 7</option>
              <option value="Lesson 8">Lesson 8</option>
              <option value="Quiz Passed">Quiz Passed</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

          <div class="field">
            <label for="progressPercent">Progress %</label>
            <input type="number" id="progressPercent" min="0" max="100" step="1" value="0" />
          </div>

          <div class="field">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" />
          </div>

          <div class="field">
            <label for="completionDate">Completion Date</label>
            <input type="date" id="completionDate" />
          </div>

          <div class="field">
            <label for="certificateIssued">Certificate Issued</label>
            <select id="certificateIssued">
              <option value="false">No</option>
              <option value="true">Yes</option>
            </select>
          </div>

          <div class="field">
            <label for="courseVersion">Course Version</label>
            <input type="text" id="courseVersion" value="2026-03" />
          </div>

          <div class="field full">
            <label for="accessCode">Access Code</label>
            <input type="text" id="accessCode" placeholder="Auto-generated if left blank" />
          </div>

          <div class="field full">
            <label for="notes">Notes</label>
            <textarea
              id="notes"
              rows="4"
              placeholder="Optional notes about payment, direct pay, waived reason, follow-up, etc."
            ></textarea>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-light" id="cancelStudentBtn">Cancel</button>
          <button type="submit" class="btn btn-gold" id="saveStudentBtn">Save Student</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/admin.js"></script>
</body>
</html>
