<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Admin Dashboard</title>
  <link rel="stylesheet" href="../css/portal.css" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #fff;
    }

    .admin-shell {
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: #111827;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary { background: #f59e0b; color: #111827; }
    .btn-dark { background: #334155; color: #fff; }
    .btn-danger { background: #b91c1c; color: #fff; }
    .btn-success { background: #15803d; color: #fff; }

    .wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.15rem;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: #e2e8f0;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0b1220;
      color: #fff;
      outline: none;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .message {
      margin-top: 12px;
      min-height: 22px;
      font-size: 0.95rem;
    }

    .message.error { color: #fecaca; }
    .message.success { color: #bbf7d0; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar input {
      width: 320px;
      max-width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0b1220;
      color: #fff;
    }

    .students-table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: top;
    }

    th {
      color: #cbd5e1;
      font-size: 0.92rem;
    }

    td {
      font-size: 0.95rem;
    }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .pill.active { background: rgba(21,128,61,0.25); color: #bbf7d0; }
    .pill.locked { background: rgba(180,83,9,0.25); color: #fde68a; }
    .pill.expired { background: rgba(185,28,28,0.25); color: #fecaca; }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .row-actions button {
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mini-edit {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      margin-top: 8px;
    }

    .mini-edit select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0b1220;
      color: #fff;
    }

    .login-screen {
      max-width: 460px;
      margin: 80px auto;
      padding: 24px;
    }

    .muted {
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .code {
      font-family: Consolas, monospace;
      font-weight: 700;
      color: #fde68a;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="loginView" class="login-screen">
    <div class="card">
      <h2>Admin Sign In</h2>

      <div class="field">
        <label for="adminEmail">Email</label>
        <input type="email" id="adminEmail" autocomplete="username" />
      </div>

      <div class="field">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" autocomplete="current-password" />
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" id="adminLoginBtn">Sign In</button>
      </div>

      <div id="loginMessage" class="message"></div>
      <p class="muted">Use your Firebase admin account.</p>
    </div>
  </div>

  <div id="adminApp" class="admin-shell" style="display:none;">
    <div class="topbar">
      <h1>Broussard Shooting Academy Admin Dashboard</h1>
      <div class="topbar-actions">
        <button class="btn btn-dark" id="refreshBtn">Refresh</button>
        <button class="btn btn-danger" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="wrap">
      <div class="grid">
        <div class="card">
          <h2>Create Student</h2>

          <div class="field">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="John Smith" />
          </div>

          <div class="field">
            <label for="studentEmail">Student Email</label>
            <input type="email" id="studentEmail" placeholder="john@email.com" />
          </div>

          <div class="field">
            <label for="studentTier">Tier</label>
            <select id="studentTier">
              <option value="FULL">FULL</option>
              <option value="FREE">FREE</option>
              <option value="BASIC">BASIC</option>
            </select>
          </div>

          <div class="field">
            <label for="studentStatus">Portal Status</label>
            <select id="studentStatus">
              <option value="active">active</option>
              <option value="locked">locked</option>
              <option value="expired">expired</option>
            </select>
          </div>

          <div class="field">
            <label for="studentPaid">Paid</label>
            <select id="studentPaid">
              <option value="true">true</option>
              <option value="false">false</option>
            </select>
          </div>

          <div class="field">
            <label for="studentNotes">Admin Notes</label>
            <textarea id="studentNotes" placeholder="Optional notes..."></textarea>
          </div>

          <div class="form-actions">
            <button class="btn btn-success" id="createStudentBtn">Create Student</button>
            <button class="btn btn-dark" id="clearFormBtn">Clear</button>
          </div>

          <div id="createMessage" class="message"></div>
        </div>

        <div class="card">
          <div class="toolbar">
            <h2 style="margin:0;">Students</h2>
            <input type="text" id="searchInput" placeholder="Search by name, email, code, tier..." />
          </div>

          <div class="students-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name / Email</th>
                  <th>Access Code</th>
                  <th>Status</th>
                  <th>Tier</th>
                  <th>Paid</th>
                  <th>Student ID</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="studentsTableBody">
                <tr>
                  <td colspan="8">Loading students...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div id="tableMessage" class="message"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
