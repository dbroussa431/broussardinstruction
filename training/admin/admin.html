<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(245,158,11,0.20), transparent 32%),
        linear-gradient(135deg, #071327 0%, #0b1730 45%, #09152a 100%);
      color: #fff;
      padding: 24px;
    }

    .hidden { display: none !important; }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
    }

    .login-card,
    .panel {
      background: rgba(17, 24, 39, 0.82);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }

    .login-wrap {
      max-width: 460px;
      margin: 70px auto;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      outline: none;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56,189,248,0.18);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary { background: #f59e0b; color: #111827; }
    .btn-dark { background: #334155; color: white; }
    .btn-danger { background: #b91c1c; color: white; }
    .btn-success { background: #15803d; color: white; }

    .message {
      margin-top: 12px;
      min-height: 22px;
      font-size: 0.95rem;
    }

    .message.error { color: #fecaca; }
    .message.success { color: #bbf7d0; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toolbar input {
      width: 320px;
      max-width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1050px;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: top;
    }

    th {
      color: #cbd5e1;
      font-size: 0.88rem;
    }

    .code {
      font-family: Consolas, monospace;
      font-weight: 800;
      color: #fde68a;
    }

    .pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .pill.active { background: rgba(21,128,61,0.25); color: #bbf7d0; }
    .pill.locked { background: rgba(180,83,9,0.24); color: #fde68a; }
    .pill.expired { background: rgba(185,28,28,0.2); color: #fecaca; }

    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .row-actions button {
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .small {
      color: #cbd5e1;
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="loginView" class="login-wrap">
      <div class="login-card">
        <h2>Admin Access</h2>
        <p class="small">Emergency admin login using boss code only.</p>

        <div class="field">
          <label for="bossCode">Boss Code</label>
          <input id="bossCode" type="password" placeholder="Enter boss code" />
        </div>

        <button id="bossLoginBtn" class="btn btn-primary">Enter Admin</button>
        <div id="loginMessage" class="message"></div>
      </div>
    </div>

    <div id="adminView" class="hidden">
      <div class="topbar">
        <h1>BSA Admin Dashboard</h1>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button id="refreshBtn" class="btn btn-dark">Refresh</button>
          <button id="logoutBtn" class="btn btn-danger">Logout</button>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <h2>Create Student</h2>

          <div class="field">
            <label for="studentName">Student Name</label>
            <input id="studentName" type="text" placeholder="John Smith" />
          </div>

          <div class="field">
            <label for="studentEmail">Student Email</label>
            <input id="studentEmail" type="email" placeholder="john@email.com" />
          </div>

          <div class="field">
            <label for="studentTier">Tier</label>
            <select id="studentTier">
              <option value="FULL">FULL</option>
              <option value="FREE">FREE</option>
              <option value="BASIC">BASIC</option>
            </select>
          </div>

          <div class="field">
            <label for="studentStatus">Status</label>
            <select id="studentStatus">
              <option value="active">active</option>
              <option value="locked">locked</option>
              <option value="expired">expired</option>
            </select>
          </div>

          <div class="field">
            <label for="studentPaid">Paid</label>
            <select id="studentPaid">
              <option value="true">true</option>
              <option value="false">false</option>
            </select>
          </div>

          <div class="field">
            <label for="studentNotes">Notes</label>
            <textarea id="studentNotes" placeholder="Optional admin notes"></textarea>
          </div>

          <button id="createStudentBtn" class="btn btn-success">Create Student</button>
          <div id="createMessage" class="message"></div>
        </div>

        <div class="panel">
          <div class="toolbar">
            <h2 style="margin:0;">Existing Students</h2>
            <input id="searchInput" type="text" placeholder="Search students..." />
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name / Email</th>
                  <th>Access Code</th>
                  <th>Status</th>
                  <th>Tier</th>
                  <th>Paid</th>
                  <th>ID</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="studentsTableBody">
                <tr><td colspan="7">Loading students...</td></tr>
              </tbody>
            </table>
          </div>

          <div id="tableMessage" class="message"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
