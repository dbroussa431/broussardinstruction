<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSA Scenario Review</title>

<!-- Fallback brand styles (overridden by styles.css when present). -->
<style id="bsa-fallback">
  :root{--bsa-blue:#1f468c;--bsa-blue-dark:#17356b;--bsa-gold:#d8a62a;--bsa-gold-dark:#b88918;
    --bg:#f4f6fb;--card:#fff;--text:#142033;--muted:#68758a;--line:#d9e0ec;--success:#18864b;--danger:#c4372f;--warning:#b57916;
    --shadow:0 14px 35px rgba(19,40,78,.12);--radius:18px;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef2f9,#f7f8fc);color:var(--text);overflow-x:hidden;}
  a{text-decoration:none;color:inherit;} img{max-width:100%;display:block;} button{font:inherit;}
  .hidden{display:none !important;}
  .topbar{background:linear-gradient(135deg,var(--bsa-blue-dark),var(--bsa-blue));color:#fff;padding:18px 24px;box-shadow:0 8px 20px rgba(0,0,0,.18);position:sticky;top:0;z-index:50;}
  .topbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand-mark{width:56px;height:56px;border-radius:14px;background:#fff;padding:6px;display:grid;place-items:center;flex:0 0 auto;font-weight:900;color:var(--bsa-blue);}
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand h1{margin:0;font-size:1.25rem;line-height:1.1;} .brand p{margin:2px 0 0;color:rgba(255,255,255,.85);font-size:.92rem;}
  .top-actions,.lesson-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .container{max-width:1200px;margin:28px auto 48px;padding:0 20px;}
  .panel{background:var(--card);border:1px solid rgba(17,35,74,.06);border-radius:var(--radius);box-shadow:var(--shadow);}
  .content-card{padding:26px;} .content-card h2{margin-top:0;font-size:2rem;}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-gold{background:var(--bsa-gold);color:#1d1500;} .btn-blue{background:var(--bsa-blue);color:#fff;}
  .btn-light{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);}
  .btn-outline{background:#fff;color:var(--bsa-blue);border:1px solid var(--line);}
  .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;}
  .eyebrow{display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(31,70,140,.08);color:var(--bsa-blue);font-size:.82rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin-bottom:14px;}
  .muted{color:var(--muted);} .small{font-size:.92rem;}
  .notice{padding:14px 16px;border-radius:12px;font-weight:700;border:1px solid transparent;}
  .notice.warn{background:#fff3da;color:var(--warning);border-color:#f4de9d;}
  .scenario-block{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px;}
  .scenario-header{font-weight:800;margin-bottom:10px;color:var(--bsa-blue-dark);}
  .scenario-options label{display:block;padding:8px 10px;border-radius:8px;cursor:pointer;}
  .scenario-options input{margin-right:8px;}
  .banner{border-radius:16px;padding:16px 18px;font-weight:700;margin-bottom:18px;}
  .banner.pass{background:#e3f7ea;border:1px solid #c5ebd3;color:var(--success);}
  .banner.retake{background:#fee6e4;border:1px solid #f4c5c0;color:var(--danger);}
  .review-item{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fcfdff;margin-bottom:12px;}
  .review-item p{margin:6px 0;line-height:1.55;}
</style>

<link rel="stylesheet" href="styles.css" onerror="this.remove()">

<!-- Enhancement styles for NEW elements (answered counter, progress, scenario feedback). -->
<style id="bsa-enhance">
  .sc-progress-wrap{margin:18px 0 6px;}
  .sc-count{font-weight:800;color:var(--bsa-blue-dark,#17356b);margin-bottom:8px;}
  .sc-bar{height:12px;border-radius:999px;background:#e9eef8;overflow:hidden;}
  .sc-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--bsa-gold,#d8a62a),#efc45d);transition:width .25s ease;}
  .scenario-block .scenario-options label{border:1px solid var(--line,#d9e0ec);margin-bottom:8px;transition:.15s ease;font-weight:600;}
  .scenario-block .scenario-options label:hover{background:#eef4ff;border-color:var(--bsa-blue,#1f468c);}
  .scenario-block .scenario-options label.picked{background:#e7efff;border-color:var(--bsa-blue,#1f468c);box-shadow:0 0 0 2px rgba(31,70,140,.15);}
  .scenario-block.answered{border-color:#cfe0f5;}
  .sc-submit-hint{color:var(--muted,#68758a);margin:10px 0 0;font-size:.92rem;}
  .review-item.good{border-left:5px solid var(--success,#18864b);}
  .review-item.bad{border-left:5px solid var(--danger,#c4372f);}
  .review-tag{display:inline-block;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;margin-bottom:4px;}
  .review-tag.good{background:#dff5e8;color:var(--success,#18864b);}
  .review-tag.bad{background:#fde4e2;color:var(--danger,#c4372f);}
  .state{text-align:center;padding:60px 20px;color:var(--muted,#68758a);}
  .state h2{color:var(--bsa-blue-dark,#17356b);}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png" alt="BSA" onerror="this.replaceWith(document.createTextNode('BSA'))"></div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Scenario Review</p>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn btn-light" href="dashboard.html">Dashboard</a>
      <a class="btn btn-gold" id="toQuizTop" href="#">Continue to Quiz</a>
    </div>
  </div>
</header>

<main class="container" id="layout">
  <section class="panel content-card">
    <span class="eyebrow">Scenario-Based Decision Training</span>
    <h2 id="scenarioTitle">Scenario Review</h2>

    <div class="notice warn small">
      You must complete and submit all scenarios before moving to the quiz.
    </div>

    <div class="sc-progress-wrap">
      <div class="sc-count"><span id="scAnswered">0</span> of <span id="scTotal">0</span> scenarios answered</div>
      <div class="sc-bar"><i id="scBar"></i></div>
    </div>

    <div id="scenarioWrap"></div>

    <div id="scenarioResults" class="hidden"></div>

    <div class="lesson-actions">
      <button class="btn btn-blue" id="submitScenarioBtn" disabled>Submit Scenario Review</button>
      <a class="btn btn-gold" id="quizLink">Continue to Quiz</a>
      <a class="btn btn-outline" id="backToLesson">Back to Lesson</a>
    </div>
    <p class="sc-submit-hint" id="submitHint">Answer all scenarios to enable submission.</p>
  </section>
</main>

<script src="data.js"></script>

<!-- =========================================================
     CORE RENDERER (classic, no imports — always runs).
     Builds scenarios directly from data.js so the page can never
     get stuck on "Loading…" or show "0 of 0" when the backend is
     slow or down. Backend persistence is layered on separately.
     ========================================================= -->
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  window.__bsaHooks = window.__bsaHooks || {};

  var lessonId = Number(new URLSearchParams(window.location.search).get("lesson")) || 1;

  if (!window.LESSONS || !Array.isArray(window.LESSONS)) {
    $("layout").innerHTML = '<section class="panel content-card"><div class="state"><h2>Course data unavailable</h2><p>data.js did not load.</p></div></section>';
    return;
  }

  var lesson = window.LESSONS.find(function (l) { return l.id === lessonId; });
  if (!lesson) {
    $("scenarioWrap").innerHTML = '<div class="state"><h2>Lesson not found</h2><p>No lesson with id ' + lessonId + '.</p></div>';
    return;
  }
  window.__BSA_LESSON__ = lesson;

  // how many scenarios this lesson presents
  var count = 2;
  if (lessonId === 8 || lessonId === 9) count = 3;
  if (lessonId === 10) count = 5;

  // Build a reliable scenario set from data.js:
  //  1) the lesson's curated decision scenarios, then
  //  2) top up from QUIZ_BANK (multiple-choice / true-false) if more are needed.
  function buildScenarios(lesson, count) {
    var out = [];
    (lesson.scenarios || []).forEach(function (s) {
      if (s && s.prompt && Array.isArray(s.choices) && s.choices.length >= 2) {
        out.push({ prompt: s.prompt, choices: s.choices.slice(), answer: Number(s.answer), explanation: s.explanation || "" });
      }
    });
    var bank = (window.QUIZ_BANK && window.QUIZ_BANK[lesson.id]) || [];
    for (var i = 0; out.length < count && i < bank.length; i++) {
      var q = bank[i];
      if (q.type === "tf") {
        out.push({ prompt: q.q, choices: ["True", "False"], answer: q.answer ? 0 : 1, explanation: q.explanation || "" });
      } else if (Array.isArray(q.choices) && q.choices.length >= 2) {
        out.push({ prompt: q.q, choices: q.choices.slice(), answer: Number(q.answer), explanation: q.explanation || "" });
      }
    }
    return out.slice(0, count);
  }

  var scenarios = buildScenarios(lesson, count);
  window.__BSA_SCENARIOS__ = scenarios;

  $("scenarioTitle").textContent = lesson.id + ". " + lesson.title + " — Scenario Review";
  document.title = "BSA Scenario · " + lesson.title;
  $("toQuizTop").href = "quiz.html?lesson=" + lesson.id;
  $("quizLink").href = "quiz.html?lesson=" + lesson.id;
  $("backToLesson").href = "lesson.html?lesson=" + lesson.id;
  $("scTotal").textContent = scenarios.length;

  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  var wrap = $("scenarioWrap");
  scenarios.forEach(function (sc, index) {
    var block = document.createElement("div");
    block.className = "scenario-block";
    block.id = "scblock-" + index;

    var head = document.createElement("div");
    head.className = "scenario-header";
    head.textContent = "Scenario " + (index + 1);
    block.appendChild(head);

    var p = document.createElement("p");
    p.innerHTML = esc(sc.prompt);
    block.appendChild(p);

    var options = document.createElement("div");
    options.className = "scenario-options";
    sc.choices.forEach(function (choice, i) {
      var label = document.createElement("label");
      label.innerHTML = '<input type="radio" name="scenario_' + index + '" value="' + i + '"> ' +
        String.fromCharCode(65 + i) + ". " + esc(choice);
      label.querySelector("input").addEventListener("change", function () {
        options.querySelectorAll("label").forEach(function (l) { l.classList.remove("picked"); });
        label.classList.add("picked");
        block.classList.add("answered");
        updateProgress();
        if (window.__bsaHooks.activity) window.__bsaHooks.activity();
      });
      options.appendChild(label);
    });
    block.appendChild(options);
    wrap.appendChild(block);
  });

  function answeredCount() {
    var n = 0;
    for (var i = 0; i < scenarios.length; i++) {
      if (document.querySelector('input[name="scenario_' + i + '"]:checked')) n++;
    }
    return n;
  }
  function updateProgress() {
    var n = answeredCount(), total = scenarios.length;
    $("scAnswered").textContent = n;
    $("scBar").style.width = (total ? (n / total) * 100 : 0) + "%";
    var done = n === total && total > 0;
    $("submitScenarioBtn").disabled = !done;
    $("submitHint").textContent = done ? "All scenarios answered — you can submit." : "Answer all scenarios to enable submission.";
  }
  updateProgress();

  // SUBMIT
  $("submitScenarioBtn").addEventListener("click", async function () {
    var correct = 0, html = "";
    scenarios.forEach(function (sc, index) {
      var sel = document.querySelector('input[name="scenario_' + index + '"]:checked');
      var si = sel ? Number(sel.value) : -1;
      var ok = si === sc.answer;
      if (ok) correct++;
      html += '<div class="review-item ' + (ok ? "good" : "bad") + '">' +
        '<span class="review-tag ' + (ok ? "good" : "bad") + '">' + (ok ? "Correct" : "Reconsider") + "</span>" +
        "<p><strong>Scenario " + (index + 1) + "</strong></p>" +
        "<p><strong>Your answer:</strong> " + (si >= 0 ? esc(sc.choices[si]) : "No answer selected") + "</p>" +
        "<p><strong>Best answer:</strong> " + esc(sc.choices[sc.answer]) + "</p>" +
        "<p>" + esc(sc.explanation) + "</p></div>";
    });
    var score = Math.round((correct / scenarios.length) * 100);
    var cls = score >= 70 ? "pass" : "retake";
    var banner = '<div class="banner ' + cls + '">Score: ' + score + "% — " +
      (score >= 70 ? "Scenario Complete" : "Review Recommended") + "</div>";

    var box = $("scenarioResults");
    box.innerHTML = banner + html;
    box.classList.remove("hidden");

    // optional backend persistence (no-op if app.js absent)
    if (window.__bsaHooks.scenarioComplete) {
      try { await window.__bsaHooks.scenarioComplete(lesson.id, score); } catch (e) { console.error(e); }
    }
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  });
})();
</script>

<!-- =========================================================
     OPTIONAL BACKEND (auth gate + tracking + persistence).
     Guarded so missing/down app.js never blocks the scenarios.
     ========================================================= -->
<script type="module">
(async () => {
  let app;
  try { app = await import("./app.js"); }
  catch (e) { console.info("[BSA] app.js not present — scenario review running standalone."); return; }

  try {
    const {
      requireLogin, refreshCurrentStudentFromFirestore, getCurrentStudent,
      lessonSequenceUnlocked, setScenarioCompleted
    } = app;

    if (typeof requireLogin === "function") requireLogin();

    const lesson = window.__BSA_LESSON__;
    if (!lesson) return;
    const lessonId = lesson.id;

    let student = null;
    try { student = (await refreshCurrentStudentFromFirestore?.()) || getCurrentStudent?.(); }
    catch (err) { console.error("Student load error:", err); student = getCurrentStudent?.(); }
    if (!student) { window.location.href = "index.html"; return; }

    if (lessonSequenceUnlocked && !lessonSequenceUnlocked(lessonId, student)) {
      window.location.href = "dashboard.html"; return;
    }

    // tracking (optional)
    let trackManualActivity;
    try {
      const tracking = await import("./tracking.js");
      const { initTracking, logStage, stopTracking } = tracking;
      trackManualActivity = tracking.trackManualActivity;
      await initTracking?.(student.id, lessonId);
      await logStage?.("Scenario Started");
      window.addEventListener("beforeunload", () => { stopTracking?.(); });
    } catch (err) { console.info("[BSA] tracking.js not present — skipping analytics."); }

    // wire hooks the renderer calls
    let throttled = false;
    window.__bsaHooks.activity = async () => {
      if (!trackManualActivity || throttled) return;
      throttled = true;
      try { await trackManualActivity(); } catch (e) { console.error(e); }
      setTimeout(() => { throttled = false; }, 15000);
    };
    window.__bsaHooks.scenarioComplete = async (id, score) => {
      try { await setScenarioCompleted?.(id); } catch (e) { console.error(e); }
    };
  } catch (err) {
    console.error("[BSA] backend integration error (non-fatal):", err);
  }
})();
</script>

</body>
</html>
