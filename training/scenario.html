<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSA Scenario Review</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark"><img src="assets/logo.png" alt="BSA logo"></div>
        <div><h1>Broussard Shooting Academy</h1><p>Scenario Review</p></div>
      </div>
      <div class="top-actions">
        <a class="btn btn-light" href="dashboard.html">Dashboard</a>
        <a class="btn btn-gold" id="toQuizTop" href="#">Continue to Quiz</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel content-card">
      <span class="eyebrow">2 short scenarios before the quiz</span>
      <h2 id="scenarioTitle"></h2>
      <p class="muted">Choose the best answer for each scenario. Explanations appear after you submit.</p>
      <div id="scenarioWrap"></div>
      <div id="scenarioResults" class="hidden"></div>
      <div class="lesson-actions">
        <button class="btn btn-blue" id="submitScenarioBtn">Submit Scenario Review</button>
        <a class="btn btn-outline" id="quizLink" href="#">Continue to Quiz</a>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    BSA.requireLogin();
    const lessonId = Number(BSA.qs('lesson') || 1);
    const lesson = LESSONS.find(l => l.id === lessonId) || LESSONS[0];

    const lockRemaining = BSA.getLockRemainingMs(lesson.id);
    if (lockRemaining > 0) {
      document.querySelector('main').innerHTML = `
        <section class="panel content-card">
          <span class="eyebrow">24-hour review lock</span>
          <h2>${lesson.id}. ${lesson.title} — Temporarily Locked</h2>
          <p class="muted">This lesson is locked for 24 hours after a failed quiz attempt. Please re-read your lesson material and come back when the countdown ends.</p>
          <div class="notice warn" id="lockBox">Unlocks in ${BSA.formatCountdown(lockRemaining)}</div>
          <div class="lesson-actions">
            <a class="btn btn-blue" href="dashboard.html">Back to Dashboard</a>
          </div>
        </section>`;
      const lockBox = document.getElementById('lockBox');
      setInterval(() => {
        const ms = BSA.getLockRemainingMs(lesson.id);
        if (ms <= 0) {
          window.location.reload();
          return;
        }
        lockBox.textContent = `Unlocks in ${BSA.formatCountdown(ms)}`;
      }, 1000);
      throw new Error('Lesson temporarily locked');
    }

    document.getElementById('scenarioTitle').textContent = `${lesson.id}. ${lesson.title} — Scenario Review`;
    document.getElementById('toQuizTop').href = `quiz.html?lesson=${lesson.id}`;
    document.getElementById('quizLink').href = `quiz.html?lesson=${lesson.id}`;

    const wrap = document.getElementById('scenarioWrap');
    lesson.scenarios.forEach((sc, index) => {
      const card = document.createElement('div');
      card.className = 'scenario-card';
      card.innerHTML = `<h4>Scenario ${index + 1}</h4><p>${sc.prompt}</p>`;
      const list = document.createElement('div');
      list.className = 'answer-list';
      sc.choices.forEach((choice, i) => {
        const label = document.createElement('label');
        label.className = 'answer-option';
        label.innerHTML = `<input type="radio" name="scenario_${index}" value="${i}" style="margin-right:8px"> ${String.fromCharCode(65+i)}. ${choice}`;
        list.appendChild(label);
      });
      card.appendChild(list);
      wrap.appendChild(card);
    });

    document.getElementById('submitScenarioBtn').addEventListener('click', () => {
      let html = '<div class="banner pass">Scenario review completed. Explanations shown below.</div>';
      lesson.scenarios.forEach((sc, index) => {
        const picked = document.querySelector(`input[name="scenario_${index}"]:checked`);
        const pickedIndex = picked ? Number(picked.value) : -1;
        html += `<div class="review-item"><p><strong>Scenario ${index+1}</strong></p><p>Your answer: ${pickedIndex >= 0 ? sc.choices[pickedIndex] : 'No answer selected'}</p><p>Best answer: ${sc.choices[sc.answer]}</p><p>${sc.explanation}</p></div>`;
      });
      document.getElementById('scenarioResults').innerHTML = html;
      document.getElementById('scenarioResults').classList.remove('hidden');
      BSA.setScenarioCompleted(lesson.id);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });
  </script>
</body>
</html>
