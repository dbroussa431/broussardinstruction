<script src="js/data.js"></script>
<script type="module">
  import "./js/app.js";

  window.addEventListener("DOMContentLoaded", async () => {
    const BSA = window.BSA;
    if (!BSA) return;

    BSA.requireLogin();

    const lessonId = Number(BSA.qs("lesson") || 1);
    const lesson = window.LESSONS?.find(l => l.id === lessonId) || null;
    if (!lesson) return;

    document.getElementById("backToLesson").href = `lesson.html?lesson=${lesson.id}`;
    document.getElementById("toQuizBtn").href = `quiz.html?lesson=${lesson.id}`;

    const wrap = document.getElementById("scenarioWrap");

    // Try multiple possible data shapes
    const scenarioSource =
      window.SCENARIOS ||
      window.scenarios ||
      {};

    let bank = [];

    if (Array.isArray(scenarioSource)) {
      bank = scenarioSource.filter(x => Number(x.lessonId) === lesson.id);
    } else if (Array.isArray(scenarioSource[lesson.id])) {
      bank = scenarioSource[lesson.id];
    } else if (scenarioSource[String(lesson.id)] && Array.isArray(scenarioSource[String(lesson.id)])) {
      bank = scenarioSource[String(lesson.id)];
    } else if (
      scenarioSource.lessons &&
      Array.isArray(scenarioSource.lessons[lesson.id])
    ) {
      bank = scenarioSource.lessons[lesson.id];
    }
console.log("lessonId:", lessonId);
console.log("window.LESSONS:", window.LESSONS);
console.log("window.SCENARIOS:", window.SCENARIOS);
console.log("window.scenarios:", window.scenarios);
console.log("lesson object:", lesson);
console.log("scenarioSource:", scenarioSource);
console.log("bank:", bank);
    
    if (!bank.length) {
      wrap.innerHTML = '<div class="notice bad">No scenarios found for this lesson yet.</div>';
      return;
    }

    wrap.innerHTML = "";

    bank.forEach((item, idx) => {
      const card = document.createElement("div");
      card.className = "scenario-card";

      const title = item.title || `Scenario ${idx + 1}`;
      const prompt = item.prompt || item.situation || item.question || "";
      const choices = Array.isArray(item.choices) ? item.choices : [];
      const bestAnswer = item.bestAnswer || item.answer || "";
      const explanation = item.explanation || item.why || "";

      let html = `<h3>${idx + 1}. ${title}</h3>`;
      html += `<p>${prompt}</p>`;

      if (choices.length) {
        html += `<div class="answer-list">`;
        choices.forEach(choice => {
          html += `<div class="answer-option">${choice}</div>`;
        });
        html += `</div>`;
      }

      if (bestAnswer) {
        html += `<div class="callout"><strong>Best Response:</strong> ${bestAnswer}</div>`;
      }

      if (explanation) {
        html += `<p><strong>Why it matters:</strong> ${explanation}</p>`;
      }

      card.innerHTML = html;
      wrap.appendChild(card);
    });

    document.getElementById("completeScenarioBtn").addEventListener("click", async () => {
      await BSA.setScenarioCompleted(lesson.id);
      window.location.href = `quiz.html?lesson=${lesson.id}`;
    });
  });
</script>
