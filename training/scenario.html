<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Training Portal | Scenario Review</title>
  <link rel="stylesheet" href="css/portal.css" />
  <script src="js/app.js"></script>
</head>
<body>
  <div class="portal-shell">
    <header class="portal-header">
      <h1>Broussard Shooting Academy</h1>
      <p>Scenario Review</p>
    </header>

    <main class="page-wrap">
      <section class="page-card">
        <h2 class="page-title" id="scenarioTitle">Scenario Review</h2>
        <div id="scenarioNotice" class="notice info">Loading scenario review...</div>
        <div id="scenarioWrap" class="scenario-list"></div>

        <div class="page-actions">
          <button id="completeScenarioBtn" class="btn btn-green">Submit Scenario Review</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const lessonId = new URLSearchParams(window.location.search).get("lesson");
      const lesson = window.LESSONS.find(l => l.id == lessonId);
      
      if (!lesson) {
        document.getElementById("scenarioNotice").innerText = "Lesson not found.";
        return;
      }

      document.getElementById("scenarioTitle").innerText = `${lesson.id}. ${lesson.title} — Scenario Review`;
      const wrap = document.getElementById("scenarioWrap");

      lesson.scenarios.forEach((sc, index) => {
        const card = document.createElement("div");
        card.className = "scenario-card";
        card.innerHTML = `<h4>Scenario ${index + 1}</h4><p>${sc.prompt}</p>`;
        
        const options = document.createElement("div");
        options.className = "answer-list";
        
        sc.choices.forEach((choice, i) => {
          const option = document.createElement("label");
          option.className = "scenario-choice";
          option.innerHTML = `<input type="radio" name="scenario_${index}" value="${i}" /> ${String.fromCharCode(65 + i)}. ${choice}`;
          options.appendChild(option);
        });

        card.appendChild(options);
        wrap.appendChild(card);
      });

      document.getElementById("completeScenarioBtn").addEventListener("click", () => {
        let score = 0;
        lesson.scenarios.forEach((sc, index) => {
          const selected = document.querySelector(`input[name="scenario_${index}"]:checked`);
          if (selected && parseInt(selected.value) === sc.answer) score++;
        });
        
        alert(`You answered ${score} out of ${lesson.scenarios.length} correctly.`);
      });
    });
  </script>
</body>
</html>
