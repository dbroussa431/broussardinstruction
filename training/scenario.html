<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Scenario</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>Broussard Shooting Academy</h1>
    <p>Scenario Practice</p>
  </header>

  <main class="wrap">
    <section class="card">
      <h2 id="scenarioTitle">Scenario Title</h2>
      <p id="scenarioDescription">Description of the scenario.</p>
      <button id="startScenarioBtn">Start Scenario</button>
    </section>

    <section class="actions">
      <button id="logoutBtn">Logout</button>
    </section>
  </main>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    async function loadScenario(scenarioId) {
      const scenarioRef = doc(db, "scenarios", scenarioId);
      const scenarioSnap = await getDoc(scenarioRef);

      if (scenarioSnap.exists()) {
        const scenarioData = scenarioSnap.data();
        document.getElementById("scenarioTitle").textContent = scenarioData.title;
        document.getElementById("scenarioDescription").textContent = scenarioData.description;
      }
    }

    document.getElementById("startScenarioBtn").onclick = () => {
      window.location.href = "quiz.html";  // Redirect to quiz page after scenario
    };

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("currentStudent");
      window.location.href = "index.html";
    };

    loadScenario(1);  // Load scenario 1 for example
  </script>
</body>
</html>
