<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 8 - Capstone</title>
  <link rel="stylesheet" href="../styles.css">
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <img src="../images/bsa-logo.png" alt="BSA logo">
      </div>
      <div>
        <h1>BSA Training Portal</h1>
        <p>Final Capstone Evaluation</p>
      </div>
    </div>

    <div class="top-actions">
      <a class="btn btn-light" href="../dashboard.html">Dashboard</a>
    </div>
  </div>
</header>

<main class="container">

  <section class="panel">
    <h2>Final Readiness Evaluation</h2>

    <div class="callout">
      <strong>This is your final validation.</strong>
      <ul>
        <li>Minimum passing score: 80%</li>
        <li>Some answers can automatically fail you</li>
        <li>Your time and results are tracked</li>
      </ul>
    </div>
  </section>

  <section id="lesson-content" class="panel"></section>

  <section id="scenario-container" class="panel"></section>

  <div class="lesson-actions">
    <a class="btn btn-outline" href="../dashboard.html">Previous</a>
    <a class="btn btn-blue" href="../dashboard.html">Next</a>
  </div>

</main>

<!-- IMPORTANT: LOAD DATA FIRST -->
<script src="../data.js"></script>

<script>
function renderLesson() {

  if (!window.LESSONS) {
    console.error("LESSONS not loaded");
    return;
  }

  const lesson = window.LESSONS.find(l => Number(l.id) === 8);

  if (!lesson) {
    console.error("Lesson 8 not found");
    return;
  }

  // =========================
  // RENDER GIST / SECTIONS
  // =========================

  const contentEl = document.getElementById("lesson-content");

  contentEl.innerHTML = `
    <div class="pill">SELF-CONTAINED LESSON GIST</div>
    <h2>${lesson.title}</h2>
    <p>${lesson.summary || ""}</p>
  `;

  if (Array.isArray(lesson.sections)) {
    lesson.sections.forEach(sec => {
      const block = document.createElement("div");
      block.className = "lesson-block";

      block.innerHTML = `
        <h3>${sec.heading}</h3>
        <ul>
          ${sec.body.map(b => `<li>${b}</li>`).join("")}
        </ul>
      `;

      contentEl.appendChild(block);
    });
  }

  // =========================
  // RENDER SCENARIOS (SAFE)
  // =========================

  const scenarioEl = document.getElementById("scenario-container");

  if (!Array.isArray(lesson.scenarios)) {
    console.warn("No scenarios found for lesson 8");
    return;
  }

  lesson.scenarios.forEach((sc, index) => {
    const div = document.createElement("div");
    div.className = "scenario";

    div.innerHTML = `
      <p><strong>Scenario ${index + 1}:</strong> ${sc.prompt}</p>
      <div class="options">
        ${sc.choices.map((c, i) => `
          <label>
            <input type="radio" name="q${index}" value="${i}">
            ${c}
          </label>
        `).join("")}
      </div>
    `;

    scenarioEl.appendChild(div);
  });
}

// WAIT UNTIL PAGE + DATA LOAD
window.addEventListener("DOMContentLoaded", () => {
  setTimeout(renderLesson, 50);
});
</script>

</body>
</html>
