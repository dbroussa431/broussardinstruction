<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 8 - Final Evaluation</title>
  <link rel="stylesheet" href="../styles.css">
</head>

<body>

<!-- ✅ CORRECT HEADER STRUCTURE -->
<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      <div class="brand-mark">
        <img src="../images/bsa-logo.png" alt="logo">
      </div>
      <div>
        <h1>BSA Training Portal</h1>
        <p>Final Capstone Evaluation</p>
      </div>
    </div>

    <div class="top-actions">
      <a class="btn btn-light" href="../dashboard.html">Dashboard</a>
    </div>

  </div>
</header>

<!-- ✅ MAIN CONTAINER -->
<main class="container">

  <!-- TITLE PANEL -->
  <section class="panel">
    <h2>Final Readiness Evaluation</h2>

    <div class="callout">
      <strong>This is your final validation.</strong>
      <ul>
        <li>Minimum passing score: 80%</li>
        <li>Some answers can automatically fail you</li>
        <li>Your time and results are tracked</li>
      </ul>
    </div>
  </section>

  <!-- GIST -->
  <section id="lesson-content" class="panel"></section>

  <!-- SCENARIOS -->
  <section class="panel">
    <div id="scenario-container"></div>

    <div class="lesson-actions" style="margin-top:20px;">
      <button class="btn btn-blue" id="submitBtn">Submit Answers</button>
    </div>
  </section>

  <!-- NAV -->
  <div class="lesson-actions">
    <a class="btn btn-outline" href="../dashboard.html">Previous</a>
    <a class="btn btn-blue" href="../dashboard.html">Next</a>
  </div>

</main>

<script src="../data.js"></script>

<script>
const lesson = window.LESSONS.find(l => Number(l.id) === 8);

// ======================
// GIST
// ======================

const contentEl = document.getElementById("lesson-content");

contentEl.innerHTML = `
  <div class="pill">SELF-CONTAINED LESSON GIST</div>
  <h2>${lesson.title}</h2>
  <p>${lesson.summary}</p>
`;

lesson.sections.forEach(sec => {
  const block = document.createElement("div");
  block.style.marginTop = "20px";

  block.innerHTML = `
    <h3>${sec.heading}</h3>
    <ul>
      ${sec.body.map(b => `<li>${b}</li>`).join("")}
    </ul>
  `;

  contentEl.appendChild(block);
});

// ======================
// SCENARIOS
// ======================

const container = document.getElementById("scenario-container");

lesson.scenarios.forEach((sc, index) => {

  const div = document.createElement("div");
  div.style.marginBottom = "20px";

  div.innerHTML = `
    <div style="margin-bottom:10px;">
      <strong>Scenario ${index + 1}:</strong> ${sc.prompt}
    </div>

    <div>
      ${sc.choices.map((choice, i) => `
        <label style="display:block; margin:6px 0;">
          <input type="radio" name="q${index}" value="${i}">
          ${choice}
        </label>
      `).join("")}
    </div>
  `;

  container.appendChild(div);
});

// ======================
// SUBMIT
// ======================

document.getElementById("submitBtn").addEventListener("click", () => {

  let score = 0;

  lesson.scenarios.forEach((sc, index) => {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);

    if (selected && Number(selected.value) === sc.answer) {
      score++;
    }
  });

  const percent = Math.round((score / lesson.scenarios.length) * 100);

  alert(`Score: ${percent}%`);
});
</script>

</body>
</html>
