<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lesson 8 - Louisiana Law and Mental Health</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="container">
  <header class="header">
    <h1>BSA Training Portal</h1>
    <button onclick="window.location.href='../dashboard.html'">Dashboard</button>
  </header>

  <main id="lesson-container"></main>
</div>

<script src="../data.js"></script>
<script>

const lessonId = 8;
const lesson = window.LESSONS.find(l => l.id === lessonId);

const container = document.getElementById('lesson-container');

function renderLesson() {
  if (!lesson) {
    container.innerHTML = '<p>Lesson not found.</p>';
    return;
  }

  let html = `
    <div class="lesson-card">
      <h2>${lesson.title}</h2>
      <p>${lesson.summary}</p>
    </div>
  `;

  lesson.sections.forEach(section => {
    html += `
      <div class="lesson-card">
        <h3>${section.heading}</h3>
        <ul>
          ${section.body.map(item => `<li>${item}</li>`).join('')}
        </ul>
      </div>
    `;
  });

  html += `<div class="lesson-card"><h3>Scenarios</h3>`;

  lesson.scenarios.forEach((scenario, index) => {
    html += `
      <div class="scenario">
        <p><strong>Scenario ${index + 1}:</strong> ${scenario.prompt}</p>
        ${scenario.choices.map((choice, i) => `
          <label>
            <input type="radio" name="q${index}" value="${i}">
            ${choice}
          </label><br>
        `).join('')}
      </div>
    `;
  });

  html += `
    <button onclick="submitAnswers()">Submit Answers</button>
    <div id="results"></div>
  </div>`;

  container.innerHTML = html;
}

function submitAnswers() {
  let score = 0;

  lesson.scenarios.forEach((scenario, index) => {
    const selected = document.querySelector(`input[name=\"q${index}\"]:checked`);

    if (selected && parseInt(selected.value) === scenario.answer) {
      score++;
    }
  });

  const percent = Math.round((score / lesson.scenarios.length) * 100);

  document.getElementById('results').innerHTML = `
    <h3>Your Score: ${percent}%</h3>
    <p>${percent >= 80 ? 'PASS' : 'FAIL'}</p>
  `;
}

renderLesson();

</script>

</body>
</html>
