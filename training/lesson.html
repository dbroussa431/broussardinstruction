<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSA Lesson</title>

<!--
  FALLBACK STYLES (loaded BEFORE styles.css on purpose).
  When the portal's styles.css is present it loads after this block and wins,
  so the page matches the rest of the portal. When styles.css is missing
  (e.g. standalone preview) this keeps the page looking like the BSA brand
  instead of unstyled HTML. Uses the same blue/gold palette.
-->
<style id="bsa-fallback">
  :root{
    --bsa-blue:#1f468c;--bsa-blue-dark:#17356b;--bsa-gold:#d8a62a;--bsa-gold-dark:#b88918;
    --bg:#f4f6fb;--card:#fff;--text:#142033;--muted:#68758a;--line:#d9e0ec;
    --success:#18864b;--danger:#c4372f;--warning:#b57916;
    --shadow:0 14px 35px rgba(19,40,78,.12);--radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(180deg,#eef2f9 0%,#f7f8fc 100%);color:var(--text);overflow-x:hidden;}
  a{text-decoration:none;color:inherit;}
  img{max-width:100%;display:block;}
  button{font:inherit;}
  .hidden{display:none !important;}
  .topbar{background:linear-gradient(135deg,var(--bsa-blue-dark),var(--bsa-blue));color:#fff;
    padding:18px 24px;box-shadow:0 8px 20px rgba(0,0,0,.18);position:sticky;top:0;z-index:50;}
  .topbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand-mark{width:56px;height:56px;border-radius:14px;background:#fff;padding:6px;display:grid;place-items:center;flex:0 0 auto;
    font-weight:900;color:var(--bsa-blue);font-size:18px;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand h1{margin:0;font-size:1.25rem;line-height:1.1;}
  .brand p{margin:2px 0 0;color:rgba(255,255,255,.85);font-size:.92rem;}
  .top-actions,.lesson-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .container{max-width:1200px;margin:28px auto 48px;padding:0 20px;}
  .panel{background:var(--card);border:1px solid rgba(17,35,74,.06);border-radius:var(--radius);box-shadow:var(--shadow);}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-gold{background:var(--bsa-gold);color:#1d1500;}
  .btn-gold:hover{background:var(--bsa-gold-dark);}
  .btn-light{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);}
  .btn-blue{background:var(--bsa-blue);color:#fff;}
  .btn-outline{background:#fff;color:var(--bsa-blue);border:1px solid var(--line);}
  .eyebrow{display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(31,70,140,.08);color:var(--bsa-blue);
    font-size:.82rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin-bottom:14px;}
  .muted{color:var(--muted);}
  .small{font-size:.92rem;}
  .lesson-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;}
  .sidebar{padding:18px;position:sticky;top:98px;height:fit-content;}
  .sidebar h3{margin:0 0 10px;}
  .sidebar a{display:block;padding:10px 12px;border-radius:10px;margin-bottom:6px;color:var(--bsa-blue-dark);font-weight:700;}
  .sidebar a.active,.sidebar a:hover{background:#eef4ff;}
  .content-card{padding:26px;}
  .content-card h2{margin-top:0;font-size:2rem;}
  .content-card h3{margin-top:24px;}
  .content-card p,.content-card li{line-height:1.7;}
  .callout{background:#f8fbff;border-left:4px solid var(--bsa-gold);padding:16px;border-radius:12px;margin:18px 0;}
  .lesson-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;}
  .chip,.pill{border-radius:999px;padding:8px 12px;font-size:.88rem;font-weight:700;border:1px solid var(--line);background:#f9fbff;}
  .notice{padding:14px 16px;border-radius:12px;font-weight:700;border:1px solid transparent;}
  .notice.warn{background:#fff3da;color:var(--warning);border-color:#f4de9d;}
  @media (max-width:980px){.lesson-layout{grid-template-columns:1fr;}.sidebar{position:static;}}
</style>

<!-- Portal stylesheet (authoritative when present; ignored gracefully if missing). -->
<link rel="stylesheet" href="styles.css" onerror="this.remove()">

<!--
  ENHANCEMENT STYLES (loaded AFTER styles.css).
  These target NEW elements this page adds (reading-progress bar, section
  numbering, statement list, inline self-check, prev/next nav, sidebar
  progress). styles.css has no rules for these selectors, so order is safe
  and nothing in the portal is overridden. Palette matches the brand vars.
-->
<style id="bsa-enhance">
  #readProgress{position:fixed;top:0;left:0;height:3px;width:0%;
    background:linear-gradient(90deg,var(--bsa-gold,#d8a62a),#efc45d);z-index:60;transition:width .12s linear;}

  .lesson-layout{padding-top:28px;align-items:start;}

  .sidebar .side-eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted,#68758a);font-weight:800;margin-bottom:8px;}
  .sidebar .side-progress{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:.8rem;color:var(--muted,#68758a);font-weight:700;}
  .sidebar .side-progress .bar{flex:1;height:6px;border-radius:999px;background:#e9eef8;overflow:hidden;}
  .sidebar .side-progress .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--bsa-gold,#d8a62a),#efc45d);transition:width .2s;}
  #sideSections a{display:flex;align-items:flex-start;gap:10px;line-height:1.35;}
  #sideSections a .num{font-size:.78rem;color:#9aa6ba;min-width:20px;font-weight:800;padding-top:1px;}
  #sideSections a.active .num{color:var(--bsa-blue,#1f468c);}

  #lessonSummary{font-size:1.06rem;line-height:1.65;color:#3c4a5e;
    border-left:4px solid var(--bsa-gold,#d8a62a);padding-left:18px;margin:6px 0 26px;}

  #lessonContent section{padding:24px 0;border-top:1px solid var(--line,#d9e0ec);scroll-margin-top:96px;}
  #lessonContent section:first-child{border-top:none;padding-top:4px;}
  #lessonContent h3{display:flex;align-items:baseline;gap:12px;color:var(--bsa-blue-dark,#17356b);}
  #lessonContent h3 .secnum{font-size:.72rem;font-weight:800;color:var(--bsa-blue,#1f468c);
    background:rgba(31,70,140,.08);border-radius:6px;padding:3px 8px;letter-spacing:.06em;flex:0 0 auto;}
  ul.statements{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  ul.statements li{position:relative;padding-left:22px;line-height:1.65;color:#27384f;}
  ul.statements li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;
    border:1.5px solid var(--bsa-gold,#d8a62a);transform:rotate(45deg);}
  ul.statements li.quote{padding:13px 16px;margin:2px 0;font-style:italic;color:var(--bsa-blue-dark,#17356b);
    background:#f1f5fc;border-radius:12px;border:1px solid #dde6f4;}
  ul.statements li.quote::before{display:none;}
  .nobethere{color:var(--bsa-gold-dark,#b88918);font-weight:800;font-style:normal;}

  /* inline self-check */
  .selfcheck{margin-top:30px;border-top:1px solid var(--line,#d9e0ec);padding-top:26px;}
  .selfcheck h3{margin:0 0 4px;color:var(--bsa-blue-dark,#17356b);}
  .selfcheck .sc-sub{color:var(--muted,#68758a);margin:0 0 20px;}
  .scq{background:#fcfdff;border:1px solid var(--line,#d9e0ec);border-radius:14px;padding:18px;margin-bottom:14px;}
  .scq .scq-prompt{margin:0 0 14px;font-weight:800;color:var(--bsa-blue-dark,#17356b);line-height:1.5;}
  .scq .scq-prompt .q{color:var(--bsa-gold-dark,#b88918);margin-right:8px;}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{display:flex;align-items:center;gap:11px;text-align:left;width:100%;font:inherit;font-weight:600;
    padding:12px 14px;border-radius:12px;border:1px solid var(--line,#d9e0ec);background:#fff;color:var(--text,#142033);cursor:pointer;transition:.15s ease;}
  .choice:hover:not(:disabled){background:#f4f8ff;border-color:var(--bsa-blue,#1f468c);}
  .choice .marker{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line,#d9e0ec);
    display:grid;place-items:center;font-size:.8rem;font-weight:800;color:var(--muted,#68758a);}
  .choice.correct{background:#eefaf2;border-color:#c8dfcf;color:#136b39;}
  .choice.correct .marker{border-color:var(--success,#18864b);color:var(--success,#18864b);}
  .choice.wrong{background:#fff1f0;border-color:#f3c7c3;color:#9f2a24;}
  .choice.wrong .marker{border-color:var(--danger,#c4372f);color:var(--danger,#c4372f);}
  .choice:disabled{cursor:default;}
  .scq-explain{margin-top:12px;padding:12px 14px;border-radius:12px;background:#eefaf2;border-left:4px solid var(--success,#18864b);
    color:#22503a;line-height:1.5;font-size:.95rem;}
  .scq-explain.miss{background:#fff1f0;border-left-color:var(--danger,#c4372f);color:#7d2722;}

  /* prev / next */
  .lesson-nav{display:flex;justify-content:space-between;gap:14px;margin-top:26px;}
  .lesson-nav a{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;
    background:#fff;border:1px solid var(--line,#d9e0ec);transition:.15s ease;}
  .lesson-nav a:hover{border-color:var(--bsa-blue,#1f468c);background:#f7faff;transform:translateY(-1px);}
  .lesson-nav a.next{text-align:right;align-items:flex-end;}
  .lesson-nav a.disabled{opacity:.4;pointer-events:none;}
  .lesson-nav .dir{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#68758a);font-weight:800;}
  .lesson-nav .lt{font-weight:800;color:var(--bsa-blue-dark,#17356b);line-height:1.3;}

  .state{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted,#68758a);}
  .state h2{color:var(--bsa-blue-dark,#17356b);margin:0 0 10px;}
</style>
</head>
<body>

<div id="readProgress"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png" alt="BSA" onerror="this.replaceWith(document.createTextNode('BSA'))"></div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Lesson Training</p>
      </div>
    </div>

    <div class="top-actions">
      <a class="btn btn-light" href="dashboard.html">Dashboard</a>
      <a class="btn btn-gold" id="toScenarioTop" href="#">Continue to Scenarios</a>
    </div>
  </div>
</header>

<main class="container lesson-layout" id="layout">

  <aside class="panel sidebar" id="sidebar">
    <div class="side-eyebrow">In this lesson</div>
    <h3 id="sideTitle">Lesson</h3>
    <div class="side-progress" aria-hidden="true">
      <div class="bar"><i id="sideProgBar"></i></div>
      <span id="sideProgPct">0%</span>
    </div>
    <nav id="sideSections" aria-label="Lesson sections"></nav>
    <div id="lessonWarning" class="notice warn small hidden"></div>
  </aside>

  <section class="panel content-card" id="card">

    <span class="eyebrow" id="lessonTypeLabel"></span>

    <h2 id="lessonTitle"></h2>

    <div class="lesson-meta" id="lessonMeta"></div>

    <p id="lessonSummary" class="muted"></p>

    <div id="lessonContent"></div>

    <div class="callout" id="lessonCallout">
      <strong>Important:</strong> You must understand this material before continuing.
    </div>

    <div id="selfCheck"></div>

    <div class="lesson-actions">
      <a class="btn btn-blue" id="toScenarioBottom" href="#">Continue to Scenarios</a>
      <a class="btn btn-outline" href="dashboard.html">Back to Dashboard</a>
    </div>

    <nav class="lesson-nav" id="lessonNav" aria-label="Lesson navigation"></nav>

  </section>

</main>

<!-- AI Assistant — markup owned by ai.js (BSA Instructor v7.1) when present. -->
<button id="aiToggleBtn">💬 Ask Instructor</button>

<div id="aiPanel" class="hidden">
  <div id="aiHeader">
    <span>BSA Instructor</span>
    <button id="aiClose" aria-label="Close">✖</button>
  </div>
  <div id="aiMessages"></div>
  <div id="aiInputArea">
    <input id="aiInput" type="text" placeholder="Ask about this lesson..." />
    <button id="aiSend">Send</button>
  </div>
</div>

<!-- Course data (required). -->
<script src="data.js"></script>

<!-- =========================================================
     CORE RENDERER (classic script, no imports — always runs).
     Renders the lesson from window.LESSONS regardless of whether
     the portal's backend modules are present.
     ========================================================= -->
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  function showState(title, msg) {
    $("layout").innerHTML =
      '<div class="state"><h2>' + title + "</h2><p>" + msg + "</p>" +
      '<p style="margin-top:18px"><a class="btn btn-outline" href="dashboard.html">Back to Dashboard</a></p></div>';
  }

  var lessonId = Number(new URLSearchParams(window.location.search).get("lesson")) || 1;

  if (!window.LESSONS || !Array.isArray(window.LESSONS)) {
    showState("Course data unavailable", "data.js did not load. Check that the file exists alongside this page.");
    return;
  }

  var lessons = window.LESSONS.slice().sort(function (a, b) { return a.id - b.id; });
  var lesson = lessons.find(function (l) { return l.id === lessonId; });

  if (!lesson) {
    showState("Lesson not found", "No lesson with id " + lessonId + " exists in the course data.");
    return;
  }

  window.__BSA_LESSON__ = lesson;

  var typeMap = {
    8:  { label: "Louisiana Law Instruction",    warn: "⚠️ Legal knowledge is required. Misunderstanding the law can result in criminal charges." },
    9:  { label: "Mental Readiness Training",    warn: "⚠️ Mental readiness is critical. Poor judgment can cost lives." },
    10: { label: "Final Evaluation Preparation", warn: "🚨 Final Evaluation ahead. You are expected to demonstrate full understanding." }
  };
  var meta = typeMap[lesson.id] || { label: "Core Training Lesson", warn: null };

  $("lessonTypeLabel").textContent = meta.label;
  $("lessonTitle").textContent = lesson.id + ". " + lesson.title;
  $("lessonSummary").textContent = lesson.summary || "";
  $("sideTitle").textContent = lesson.title;
  document.title = "BSA · " + lesson.title;

  var secCount = (lesson.sections || []).length;
  var chips = [];
  if (lesson.estTime) chips.push('<span class="chip">⏱ Est. ' + lesson.estTime + "</span>");
  chips.push('<span class="chip">' + secCount + " sections</span>");
  chips.push('<span class="chip">Lesson ' + lesson.id + " of " + lessons.length + "</span>");
  $("lessonMeta").innerHTML = chips.join("");

  if (meta.warn) {
    var wb = $("lessonWarning");
    wb.textContent = meta.warn;
    wb.classList.remove("hidden");
  }
  if (lesson.id === 10) {
    $("lessonCallout").innerHTML = "<strong>Final Standard:</strong> You must apply law and judgment correctly to pass.";
  }

  function decorate(text) {
    var safe = String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    safe = safe.replace(/(["“]?No Be There["”]?)/g, '<span class="nobethere">$1</span>');
    return safe;
  }
  function isQuote(text) {
    var t = String(text).trim();
    return t.charAt(0) === "“" || t.charAt(0) === '"';
  }

  var side = $("sideSections");
  var content = $("lessonContent");

  (lesson.sections || []).forEach(function (section, idx) {
    var anchor = "sec" + (idx + 1);
    var n = String(idx + 1).padStart(2, "0");

    var link = document.createElement("a");
    link.href = "#" + anchor;
    link.dataset.target = anchor;
    link.innerHTML = '<span class="num">' + n + '</span><span>' + decorate(section.heading) + "</span>";
    if (idx === 0) link.classList.add("active");
    side.appendChild(link);

    var wrap = document.createElement("section");
    wrap.id = anchor;
    wrap.setAttribute("data-screen-label", "Section " + n);

    var h = document.createElement("h3");
    h.innerHTML = '<span class="secnum">' + n + '</span><span>' + decorate(section.heading) + "</span>";
    wrap.appendChild(h);

    var ul = document.createElement("ul");
    ul.className = "statements";
    (section.body || []).forEach(function (item) {
      var li = document.createElement("li");
      if (isQuote(item)) li.className = "quote";
      li.innerHTML = decorate(item);
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    content.appendChild(wrap);
  });

  // inline knowledge check — pulls 2 questions from this lesson's quiz bank
  // (NOT the graded scenarios), so it reinforces the reading without spoiling
  // the separate, graded Scenario Review.
  var bank = (window.QUIZ_BANK && window.QUIZ_BANK[lesson.id]) || [];
  function normCheck(qq) {
    if (!qq) return null;
    if (qq.type === "tf") {
      return { prompt: qq.q, choices: ["True", "False"], answer: qq.answer ? 0 : 1, explanation: qq.explanation || "" };
    }
    if (Array.isArray(qq.choices) && qq.choices.length >= 2) {
      return { prompt: qq.q, choices: qq.choices, answer: Number(qq.answer), explanation: qq.explanation || "" };
    }
    return null;
  }
  // two spaced-out questions for variety
  var idxPool = [4, 9, 13, 6, 2, 0, 1];
  var checks = [];
  for (var pi = 0; pi < idxPool.length && checks.length < 2; pi++) {
    var nc = normCheck(bank[idxPool[pi]]);
    if (nc) checks.push(nc);
  }

  if (checks.length) {
    var sc = $("selfCheck");
    var html = '<div class="selfcheck"><span class="eyebrow">Quick Knowledge Check</span>' +
      "<h3>Check your understanding</h3>" +
      '<p class="sc-sub">A quick check on what you just read — this is not graded. Your Scenario Review and quiz come next.</p>';
    checks.forEach(function (s, qi) {
      html += '<div class="scq" data-answer="' + s.answer + '">' +
        '<p class="scq-prompt"><span class="q">Q' + (qi + 1) + "</span>" + decorate(s.prompt) + "</p>" +
        '<div class="choices">';
      (s.choices || []).forEach(function (c, ci) {
        html += '<button class="choice" data-i="' + ci + '">' +
          '<span class="marker">' + String.fromCharCode(65 + ci) + "</span><span>" + decorate(c) + "</span></button>";
      });
      html += "</div><div class=\"scq-explain hidden\">" + decorate(s.explanation || "") + "</div></div>";
    });
    html += "</div>";
    sc.innerHTML = html;

    sc.querySelectorAll(".scq").forEach(function (q) {
      var answer = Number(q.dataset.answer);
      var explain = q.querySelector(".scq-explain");
      q.querySelectorAll(".choice").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (q.dataset.done) return;
          q.dataset.done = "1";
          var picked = Number(btn.dataset.i);
          q.querySelectorAll(".choice").forEach(function (b) {
            b.disabled = true;
            var bi = Number(b.dataset.i);
            if (bi === answer) b.classList.add("correct");
            else if (bi === picked) b.classList.add("wrong");
          });
          explain.classList.remove("hidden");
          if (picked !== answer) explain.classList.add("miss");
        });
      });
    });
  }

  var scenarioHref = "scenario.html?lesson=" + lesson.id;
  $("toScenarioTop").href = scenarioHref;
  $("toScenarioBottom").href = scenarioHref;

  // prev / next lesson
  var pos = lessons.findIndex(function (l) { return l.id === lesson.id; });
  var prev = lessons[pos - 1], next = lessons[pos + 1];
  var navHtml = "";
  navHtml += prev
    ? '<a class="prev" href="lesson.html?lesson=' + prev.id + '"><span class="dir">← Previous</span><span class="lt">' + prev.id + ". " + prev.title + "</span></a>"
    : '<a class="prev disabled"><span class="dir">← Previous</span><span class="lt">Start of course</span></a>';
  navHtml += next
    ? '<a class="next" href="lesson.html?lesson=' + next.id + '"><span class="dir">Next →</span><span class="lt">' + next.id + ". " + next.title + "</span></a>"
    : '<a class="next disabled"><span class="dir">Next →</span><span class="lt">Course complete</span></a>';
  $("lessonNav").innerHTML = navHtml;

  // smooth anchor scroll (no scrollIntoView)
  var headerOffset = 92;
  side.querySelectorAll("a[data-target]").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      var el = document.getElementById(a.dataset.target);
      if (!el) return;
      var y = el.getBoundingClientRect().top + window.pageYOffset - headerOffset;
      window.scrollTo({ top: y, behavior: "smooth" });
    });
  });

  // scroll-spy + reading progress
  var sections = Array.prototype.slice.call(content.querySelectorAll("section"));
  var links = Array.prototype.slice.call(side.querySelectorAll("a[data-target]"));
  var bar = $("readProgress"), sideBar = $("sideProgBar"), sidePct = $("sideProgPct");

  function onScroll() {
    var docH = document.documentElement.scrollHeight - window.innerHeight;
    var pct = docH > 0 ? Math.min(100, Math.max(0, (window.pageYOffset / docH) * 100)) : 0;
    bar.style.width = pct + "%";
    if (sideBar) sideBar.style.width = pct + "%";
    if (sidePct) sidePct.textContent = Math.round(pct) + "%";
    var activeIdx = 0;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].getBoundingClientRect().top - headerOffset - 8 <= 0) activeIdx = i;
    }
    links.forEach(function (l, i) { l.classList.toggle("active", i === activeIdx); });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });
  onScroll();
})();
</script>

<!--
  AI assistant. The portal's real ai.js (BSA Instructor v7.1) self-boots and
  fully owns this panel, so we do NOT bind any handlers here when it is loaded.
  The fallback below only activates if ai.js is absent (e.g. standalone
  preview) — checked after load via the window.__BSA_AI_BOOTED__ flag ai.js
  sets — so there is never a double-bound panel.
-->
<script src="ai.js" onerror="this.remove()"></script>

<script>
window.addEventListener("load", function () {
  setTimeout(function () {
    if (window.__BSA_AI_BOOTED__) return; // ai.js present and running — leave it alone

    var panel = document.getElementById("aiPanel");
    var toggle = document.getElementById("aiToggleBtn");
    var closeBtn = document.getElementById("aiClose");
    var msgs = document.getElementById("aiMessages");
    var input = document.getElementById("aiInput");
    var sendBtn = document.getElementById("aiSend");
    var lesson = window.__BSA_LESSON__;
    if (!panel || !toggle || !msgs || !input || !sendBtn || !lesson) return;

    // minimal light-theme bubble styles for the standalone fallback
    var st = document.createElement("style");
    st.textContent =
      "#aiPanel .fb-msg{max-width:88%;padding:9px 12px;border-radius:10px;margin-bottom:8px;font-size:13px;line-height:1.45;}" +
      "#aiPanel .fb-bot{background:#eef2f8;color:#1d3557;}" +
      "#aiPanel .fb-user{background:#1d3557;color:#fff;margin-left:auto;}";
    document.head.appendChild(st);

    var greeted = false;
    function add(text, who) {
      var d = document.createElement("div");
      d.className = "fb-msg " + (who === "user" ? "fb-user" : "fb-bot");
      d.textContent = text;
      msgs.appendChild(d);
      msgs.scrollTop = msgs.scrollHeight;
      return d;
    }
    function open() {
      panel.classList.remove("hidden");
      panel.style.display = "flex";
      if (!greeted) {
        greeted = true;
        add('Ask me anything about "' + lesson.title + '." I answer from this lesson.', "bot");
      }
      input.focus();
    }
    function close() { panel.classList.add("hidden"); panel.style.display = "none"; }
    toggle.addEventListener("click", function () {
      (panel.classList.contains("hidden")) ? open() : close();
    });
    if (closeBtn) closeBtn.addEventListener("click", close);

    function context() {
      var lines = [];
      (lesson.sections || []).forEach(function (s) {
        lines.push("## " + s.heading);
        (s.body || []).forEach(function (b) { lines.push("- " + b); });
      });
      return "Lesson " + lesson.id + ": " + lesson.title + "\n\n" + (lesson.summary || "") + "\n\n" + lines.join("\n");
    }
    async function answer(question) {
      if (window.claude && typeof window.claude.complete === "function") {
        return await window.claude.complete(
          "You are a calm, disciplined firearms-safety instructor for Broussard Shooting Academy. " +
          "Answer using ONLY the lesson material below; reinforce the avoidance-first 'No Be There' philosophy " +
          "where relevant. If not covered, say so plainly.\n\n=== LESSON ===\n" + context() +
          "\n\n=== QUESTION ===\n" + question);
      }
      return "The live instructor isn't connected in this view. This lesson covers: " +
        (lesson.sections || []).map(function (s) { return s.heading; }).join("; ") + ".";
    }
    async function send() {
      var q = input.value.trim();
      if (!q) return;
      add(q, "user");
      input.value = "";
      sendBtn.disabled = true;
      var typing = add("Instructor is thinking…", "bot");
      try { var r = await answer(q); typing.remove(); add(r, "bot"); }
      catch (e) { typing.remove(); add("Something went wrong. Please try again.", "bot"); }
      finally { sendBtn.disabled = false; input.focus(); }
    }
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
  }, 400);
});
</script>

<!-- =========================================================
     OPTIONAL BACKEND INTEGRATION (login gate + tracking).
     Runs only when the portal modules are present. Guarded so a
     missing app.js / tracking.js never breaks the lesson view.
     ========================================================= -->
<script type="module">
(async () => {
  let app;
  try {
    app = await import("./app.js");
  } catch (e) {
    console.info("[BSA] app.js not present — running lesson view standalone.");
    return;
  }

  try {
    const {
      requireLogin, refreshCurrentStudentFromFirestore, getCurrentStudent,
      lessonSequenceUnlocked, isLessonAllowedByTier, setLessonContentViewed
    } = app;

    if (typeof requireLogin === "function") requireLogin();

    const lesson = window.__BSA_LESSON__;
    if (!lesson) return;
    const lessonId = lesson.id;

    let student = null;
    try {
      student = (await refreshCurrentStudentFromFirestore?.()) || getCurrentStudent?.();
    } catch (err) {
      console.error("Student load error:", err);
      student = getCurrentStudent?.();
    }
    if (!student) { window.location.href = "index.html"; return; }

    if ((isLessonAllowedByTier && !isLessonAllowedByTier(lessonId, student.tier)) ||
        (lessonSequenceUnlocked && !lessonSequenceUnlocked(lessonId, student))) {
      window.location.href = "dashboard.html";
      return;
    }

    try {
      const tracking = await import("./tracking.js");
      const { initTracking, trackLessonView, trackManualActivity, logStage, stopTracking } = tracking;
      await initTracking?.(student.id, lessonId);
      await trackLessonView?.();
      await logStage?.("Lesson Opened");

      let throttled = false;
      const ping = async () => {
        if (throttled) return;
        throttled = true;
        try { await trackManualActivity?.(); }
        catch (err) { console.error("Manual lesson activity failed:", err); }
        setTimeout(() => { throttled = false; }, 15000);
      };
      ["click", "keydown", "scroll", "touchstart"].forEach((ev) =>
        window.addEventListener(ev, ping, { passive: true }));
      window.addEventListener("beforeunload", () => { stopTracking?.(); });
    } catch (err) {
      console.info("[BSA] tracking.js not present — skipping analytics.");
    }

    try { await setLessonContentViewed?.(lesson.id); } catch (e) {}
  } catch (err) {
    console.error("[BSA] backend integration error (non-fatal):", err);
  }
})();
</script>
