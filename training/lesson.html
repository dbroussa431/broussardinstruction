<script type="module">
import {
  requireLogin,
  refreshCurrentStudentFromFirestore,
  getCurrentStudent,
  lessonSequenceUnlocked,
  isLessonAllowedByTier,
  setLessonContentViewed
} from "./app.js";

import { startChapter8 } from "./js/chapter8-controller.js";

requireLogin();

const student = (await refreshCurrentStudentFromFirestore()) || getCurrentStudent();

const lessonId = Number(new URLSearchParams(window.location.search).get("lesson") || 1);

// 🔒 Access control
if (!isLessonAllowedByTier(lessonId, student.tier) || !lessonSequenceUnlocked(lessonId, student)) {
  window.location.href = "dashboard.html";
}

/* =========================
   🔴 CHAPTER 8 TAKES OVER FIRST
   ========================= */

if (lessonId === 8) {

  await setLessonContentViewed(8);

  document.getElementById("lessonTitle").textContent = "8. Final Readiness";
  document.getElementById("lessonSummary").textContent = "Complete all checkpoints to pass.";
  document.getElementById("sideTitle").textContent = "Final Validation";

  document.getElementById("sideSections").innerHTML = `
    <div>Law Checkpoints</div>
    <div>Mental Checkpoints</div>
    <div>Final Validation</div>
  `;

  document.getElementById("toScenarioTop").style.display = "none";
  document.getElementById("toScenarioBottom").style.display = "none";

  // 🚀 THIS IS THE KEY
  startChapter8();

  return; // ⛔ STOP everything else
}

/* =========================
   🔵 NORMAL LESSONS 1–7
   ========================= */

const lesson = window.LESSONS.find((l) => l.id === lessonId) || window.LESSONS[0];

await setLessonContentViewed(lesson.id);

document.getElementById("lessonTitle").textContent = `${lesson.id}. ${lesson.title}`;
document.getElementById("lessonSummary").textContent = lesson.summary;
document.getElementById("sideTitle").textContent = lesson.title;

const side = document.getElementById("sideSections");
const content = document.getElementById("lessonContent");

lesson.sections.forEach((section, idx) => {

  const anchor = `sec${idx + 1}`;

  const link = document.createElement("a");
  link.href = `#${anchor}`;
  link.textContent = section.heading;

  if (idx === 0) link.classList.add("active");

  side.appendChild(link);

  const wrap = document.createElement("section");
  wrap.id = anchor;
  wrap.innerHTML = `<h3>${section.heading}</h3>`;

  const ul = document.createElement("ul");

  section.body.forEach(item => {
    const li = document.createElement("li");
    li.textContent = item;
    ul.appendChild(li);
  });

  wrap.appendChild(ul);
  content.appendChild(wrap);

});

document.getElementById("toScenarioTop").href = `scenario.html?lesson=${lesson.id}`;
document.getElementById("toScenarioBottom").href = `scenario.html?lesson=${lesson.id}`;
</script>
