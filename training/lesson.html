<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSA Lesson</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png"></div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Lesson Training</p>
      </div>
    </div>

    <div class="top-actions">
      <a class="btn btn-light" href="dashboard.html">Dashboard</a>
      <a class="btn btn-gold" id="toScenarioTop" href="#">Continue to Scenarios</a>
    </div>
  </div>
</header>

<main class="container lesson-layout">

  <aside class="panel sidebar">
    <h3 id="sideTitle">Lesson</h3>
    <div id="sideSections"></div>
    <div id="lessonWarning" class="notice warn small hidden"></div>
  </aside>

  <section class="panel content-card">

    <span class="eyebrow" id="lessonTypeLabel"></span>

    <h2 id="lessonTitle"></h2>

    <p id="lessonSummary" class="muted"></p>

    <div id="lessonContent"></div>

    <div class="callout" id="lessonCallout">
      <strong>Important:</strong> You must understand this material before continuing.
    </div>

    <div class="lesson-actions">
      <a class="btn btn-blue" id="toScenarioBottom" href="#">Continue to Scenarios</a>
      <a class="btn btn-outline" href="dashboard.html">Back to Dashboard</a>
    </div>

  </section>

</main>

<script src="data.js"></script>

<script type="module">
import {
  requireLogin,
  refreshCurrentStudentFromFirestore,
  getCurrentStudent,
  lessonSequenceUnlocked,
  isLessonAllowedByTier,
  setLessonContentViewed
} from "./app.js";

import {
  initTracking,
  trackLessonView,
  trackManualActivity,
  logStage,
  stopTracking
} from "./tracking.js";

requireLogin();

let student = null;

try {
  student = (await refreshCurrentStudentFromFirestore()) || getCurrentStudent();
} catch (e) {
  console.error("Student load error:", e);
  student = getCurrentStudent();
}

const lessonId = Number(new URLSearchParams(window.location.search).get("lesson") || 1);

if (!student) {
  window.location.href = "index.html";
  throw new Error("Student session missing");
}

if (!isLessonAllowedByTier(lessonId, student.tier) || !lessonSequenceUnlocked(lessonId, student)) {
  window.location.href = "dashboard.html";
  throw new Error("Lesson access blocked");
}

const lesson = window.LESSONS.find((l) => l.id === lessonId);

if (!lesson) {
  document.getElementById("lessonContent").innerHTML = "<p>Lesson not found.</p>";
  throw new Error("Lesson missing from data.js");
}

// --------------------
// TRACKING START
// --------------------
try {
  initTracking(student.id, lessonId);
  await trackLessonView();
  await logStage("Lesson Opened");
} catch (error) {
  console.error("Lesson tracking init failed:", error);
}

// Mark lesson content viewed in your app logic too
await setLessonContentViewed(lesson.id);

// --------------------
// UI TYPE DETECTION
// --------------------
const isLaw = lessonId === 8;
const isMental = lessonId === 9;
const isFinal = lessonId === 10;

let typeLabel = "Core Training Lesson";
if (isLaw) typeLabel = "Louisiana Law Instruction";
if (isMental) typeLabel = "Mental Readiness Training";
if (isFinal) typeLabel = "Final Evaluation Preparation";

document.getElementById("lessonTypeLabel").textContent = typeLabel;
document.getElementById("lessonTitle").textContent = `${lesson.id}. ${lesson.title}`;
document.getElementById("lessonSummary").textContent = lesson.summary;
document.getElementById("sideTitle").textContent = lesson.title;

// --------------------
// WARNING SYSTEM
// --------------------
const warningBox = document.getElementById("lessonWarning");

if (isLaw) {
  warningBox.textContent = "⚠️ Legal knowledge is required. Misunderstanding law can result in criminal charges.";
  warningBox.classList.remove("hidden");
}

if (isMental) {
  warningBox.textContent = "⚠️ Mental readiness is critical. Poor judgment can cost lives.";
  warningBox.classList.remove("hidden");
}

if (isFinal) {
  warningBox.textContent = "🚨 Final Evaluation ahead. You are expected to demonstrate full understanding.";
  warningBox.classList.remove("hidden");
}

// --------------------
// CALLOUT
// --------------------
const callout = document.getElementById("lessonCallout");

if (isFinal) {
  callout.innerHTML = "<strong>Final Standard:</strong> You must apply law and judgment correctly to pass.";
}

// --------------------
// BUILD LESSON CONTENT
// --------------------
const side = document.getElementById("sideSections");
const content = document.getElementById("lessonContent");

lesson.sections.forEach((section, idx) => {
  const anchor = `sec${idx + 1}`;

  const link = document.createElement("a");
  link.href = `#${anchor}`;
  link.textContent = section.heading;
  if (idx === 0) link.classList.add("active");
  side.appendChild(link);

  const wrap = document.createElement("section");
  wrap.id = anchor;
  wrap.innerHTML = `<h3>${section.heading}</h3>`;

  const ul = document.createElement("ul");

  section.body.forEach((item) => {
    const li = document.createElement("li");
    li.textContent = item;
    ul.appendChild(li);
  });

  wrap.appendChild(ul);
  content.appendChild(wrap);
});

// --------------------
// BUTTONS
// --------------------
document.getElementById("toScenarioTop").href = `scenario.html?lesson=${lesson.id}`;
document.getElementById("toScenarioBottom").href = `scenario.html?lesson=${lesson.id}`;

// --------------------
// ACTIVITY THROTTLE
// --------------------
let activityThrottle = false;

async function handleActivityPing() {
  if (activityThrottle) return;
  activityThrottle = true;

  try {
    await trackManualActivity();
  } catch (error) {
    console.error("Manual lesson activity failed:", error);
  }

  setTimeout(() => {
    activityThrottle = false;
  }, 15000);
}

["click", "keydown", "scroll", "touchstart"].forEach((eventName) => {
  window.addEventListener(eventName, handleActivityPing, { passive: true });
});

window.addEventListener("beforeunload", () => {
  stopTracking();
});
</script>

</body>
</html>
