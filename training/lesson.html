<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Lesson</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>Broussard Shooting Academy</h1>
    <p>Lesson Overview</p>
  </header>

  <main class="wrap">
    <section class="card">
      <h2 id="lessonTitle">Lesson Title</h2>
      <p id="lessonDescription">Description of the lesson.</p>
      <button id="startLessonBtn">Start Lesson</button>
    </section>

    <section class="actions">
      <button id="logoutBtn">Logout</button>
    </section>
  </main>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    async function loadLesson(lessonId) {
      const student = JSON.parse(localStorage.getItem("currentStudent"));
      if (!student) return;

      const lessonRef = doc(db, "lessons", lessonId);
      const lessonSnap = await getDoc(lessonRef);

      if (lessonSnap.exists()) {
        const lessonData = lessonSnap.data();
        document.getElementById("lessonTitle").textContent = lessonData.title;
        document.getElementById("lessonDescription").textContent = lessonData.description;
      }
    }

    document.getElementById("startLessonBtn").onclick = () => {
      window.location.href = `quiz.html?lessonId=1`;  // Replace with the appropriate lesson ID
    };

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("currentStudent");
      window.location.href = "index.html";
    };

    loadLesson(1);  // Load lesson 1 for example
  </script>
</body>
</html>
