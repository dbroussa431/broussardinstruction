<!DOCTYPE html>
<html lang="en">
<head>

<script>
(function () {
  if (!sessionStorage.getItem("bsaConfirmed")) {
    window.location.href = "confirmation.html";
  }
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSA Student Dashboard</title>

<link rel="stylesheet" href="styles.css">

<style>

/* ===== BASE ===== */
body {
  background: #eef1f5;
}

/* ===== HERO ===== */
.hero {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
}

.hero-main {
  background: #ffffff;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.06);
}

.hero-main h2 {
  font-size: 28px;
  line-height: 1.3;
  margin: 10px 0;
}

.hero-main p {
  color: #555;
}

/* ===== SIDE PANEL ===== */
.hero-side {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.stat-card {
  background: #ffffff;
  padding: 18px;
  border-radius: 12px;
  border: 1px solid #e3e6ea;
}

.stat-card strong {
  display: block;
  font-size: 18px;
  margin-top: 6px;
}

/* ===== LESSON GRID ===== */
.lesson-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 18px;
}

/* ===== CARD ===== */
.lesson-card {
  background: #ffffff;
  border-radius: 14px;
  padding: 18px;
  border: 1px solid #e3e6ea;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: 0.2s ease;
}

.lesson-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.05);
}

/* ===== TOP ===== */
.lesson-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.lesson-num {
  background: #1d3557;
  color: white;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

/* ===== TITLE ===== */
.lesson-card h4 {
  margin: 0;
  font-size: 16px;
}

.lesson-card p {
  font-size: 13px;
  color: #555;
  margin-top: 6px;
  line-height: 1.4;
}

/* ===== STATUS ===== */
.status {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: #e6f4ea;
  color: #1e7d3b;
}

/* ===== META ===== */
.lesson-meta {
  margin-top: 12px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.chip {
  font-size: 11px;
  padding: 4px 8px;
  background: #f2f4f7;
  border-radius: 999px;
}

/* ===== ACTIONS ===== */
.lesson-actions {
  margin-top: 14px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* PRIMARY */
.lesson-actions .btn-blue {
  flex: 1 1 100%;
  font-weight: 600;
  padding: 10px;
}

/* SECONDARY */
.lesson-actions .btn-outline {
  font-size: 12px;
  padding: 6px 10px;
}

/* LOCKED */
.btn-disabled {
  opacity: 0.4;
  pointer-events: none;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  .hero {
    grid-template-columns: 1fr;
  }
}

</style>

</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <img src="./images/bsa-logo.png">
      </div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Private Student Portal • Online Prerequisite Training</p>
      </div>
    </div>

    <div class="top-actions">
      <a class="btn btn-light" href="#">Dashboard</a>
      <a class="btn btn-light" href="#live-range">Live Review & Range</a>
      <button class="btn btn-gold" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<main class="container">

<section class="hero">
  <div class="hero-main">
    <span class="eyebrow">ONLINE TRAINING PROGRESSION</span>
    <h2 id="welcomeLine"></h2>

    <p>
      Complete lessons, pass quizzes, complete scenarios,
      and pass the <strong>Final Evaluation</strong>.
    </p>
  </div>

  <div class="hero-side">
    <div class="stat-card">
      <small>Progress</small>
      <strong id="progressLabel"></strong>
    </div>

    <div class="stat-card">
      <small>Status</small>
      <strong id="studentStatus"></strong>
    </div>

    <div class="stat-card">
      <small>Account</small>
      <strong id="studentEmailLabel"></strong>
    </div>
  </div>
</section>

<h3 style="margin-top:30px;">Lesson Dashboard</h3>

<section class="lesson-grid" id="lessonGrid"></section>

</main>

<button id="aiToggleBtn">Ask Instructor</button>

<script src="data.js"></script>
<script src="ai.js"></script>

<script type="module">

import {
  requireLogin,
  refreshCurrentStudentFromFirestore,
  getCurrentStudent,
  overallProgress,
  allLessonsComplete,
  getLessonProgress,
  lessonStatus,
  logout
} from "./app.js";

requireLogin();

const student = (await refreshCurrentStudentFromFirestore()) || getCurrentStudent();
const prog = overallProgress(student);

document.getElementById("welcomeLine").textContent =
  `${student?.name || "Student"}, continue your training.`;

// INFO
document.getElementById("studentEmailLabel").textContent = student?.email || "—";
document.getElementById("progressLabel").textContent =
  `${prog.passed} / ${prog.total} Lessons Passed`;

document.getElementById("studentStatus").textContent =
  allLessonsComplete(student)
    ? "Cleared for Live Range"
    : "In Progress";

// LESSONS
const grid = document.getElementById("lessonGrid");

window.LESSONS.forEach((lesson) => {

  const status = lessonStatus(lesson.id, student);
  const progress = getLessonProgress(lesson.id, student);

  const card = document.createElement("article");
  card.className = "lesson-card";

  card.innerHTML = `
    <div class="lesson-top">
      <div style="display:flex;gap:10px;">
        <div class="lesson-num">${lesson.id}</div>
        <div>
          <h4>${lesson.title}</h4>
          <p>${lesson.summary}</p>
        </div>
      </div>
      <span class="status">${status.label}</span>
    </div>

    <div class="lesson-meta">
      <span class="chip">${lesson.estTime}</span>
    </div>

    <div class="lesson-actions">
      ${
        status.locked
          ? `<span class="btn btn-blue btn-disabled">Locked</span>`
          : `<a class="btn btn-blue" href="lesson.html?lesson=${lesson.id}">
              ${progress.contentViewed ? "Continue Lesson" : "Start Lesson"}
            </a>`
      }

      ${
        !status.locked && progress.scenarioCompleted
          ? `<a class="btn btn-outline" href="quiz.html?lesson=${lesson.id}">
              Take Quiz
            </a>`
          : ""
      }
    </div>
  `;

  grid.appendChild(card);
});

// LOGOUT
document.getElementById("logoutBtn").addEventListener("click", () => {
  sessionStorage.removeItem("bsaConfirmed");
  logout();
  window.location.href = "login.html";
});

</script>

</body>
</html>
