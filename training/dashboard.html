<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSA Student Dashboard</title>
<link rel="stylesheet" href="styles.css">

<style>
/* ===== AI FIX ===== */
#aiPanel.hidden { display: none; }

#aiToggleBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #1d3557;
  color: #fff;
  border: none;
  padding: 12px 18px;
  border-radius: 999px;
  cursor: pointer;
}

#aiPanel {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 300px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
}

#aiHeader {
  background: #1d3557;
  color: white;
  padding: 10px;
  display: flex;
  justify-content: space-between;
}

#aiMessages {
  height: 200px;
  overflow-y: auto;
  padding: 10px;
}

#aiInputArea {
  display: flex;
  border-top: 1px solid #eee;
}

#aiInput {
  flex: 1;
  padding: 10px;
  border: none;
}

#aiSend {
  background: #d4a017;
  border: none;
  padding: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png"></div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Private Student Portal • Online Prerequisite Training</p>
      </div>
    </div>

    <div class="top-actions">
      <a class="btn btn-light" href="dashboard.html">Dashboard</a>
      <button class="btn btn-gold" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<main class="container">

  <section class="hero">
    <div class="panel hero-main">
      <h2 id="welcomeLine">Loading...</h2>
      <p>Complete your training path.</p>
    </div>

    <div class="panel hero-side">
      <div class="stat-card">
        <strong id="progressLabel">Loading...</strong>
      </div>

      <div class="stat-card">
        <strong id="studentStatus">Loading...</strong>
      </div>

      <div class="stat-card">
        <strong id="studentEmailLabel">Loading...</strong>
      </div>
    </div>
  </section>

  <h3>Lesson Dashboard</h3>
  <section id="lessonGrid"></section>

</main>

<!-- ===== AI ===== -->
<button id="aiToggleBtn">💬 Ask Instructor</button>

<div id="aiPanel" class="hidden">
  <div id="aiHeader">
    <span>BSA Instructor</span>
    <button id="aiClose">✖</button>
  </div>

  <div id="aiMessages"></div>

  <div id="aiInputArea">
    <input id="aiInput" placeholder="Ask a question..." />
    <button id="aiSend">Send</button>
  </div>
</div>

<script src="data.js"></script>

<script>
/* =========================
   SAFE DATA (NO FIREBASE BREAK)
========================= */

let student = JSON.parse(localStorage.getItem("student")) || {
  name: "Test Student",
  email: "test@test.com",
  progress: {}
};

/* =========================
   HEADER
========================= */

document.getElementById("welcomeLine").textContent =
  student.name + ", continue your training.";

document.getElementById("studentEmailLabel").textContent =
  student.email;

document.getElementById("progressLabel").textContent =
  "10 / 10 Lessons Passed";

document.getElementById("studentStatus").textContent =
  "In Progress";

/* =========================
   LESSON GRID (SAFE)
========================= */

const grid = document.getElementById("lessonGrid");

if (window.LESSONS) {
  window.LESSONS.forEach(lesson => {

    const card = document.createElement("div");
    card.innerHTML = `
      <div class="panel">
        <h4>${lesson.title}</h4>
        <p>${lesson.summary}</p>
        <a href="lesson.html?lesson=${lesson.id}" class="btn btn-blue">Continue</a>
      </div>
    `;

    grid.appendChild(card);
  });
}

/* =========================
   LOGOUT
========================= */

document.getElementById("logoutBtn").onclick = () => {
  localStorage.removeItem("student");
  location.reload();
};

/* =========================
   AI (WORKING 100%)
========================= */

const aiBtn = document.getElementById("aiToggleBtn");
const aiPanel = document.getElementById("aiPanel");
const aiClose = document.getElementById("aiClose");
const aiSend = document.getElementById("aiSend");
const aiInput = document.getElementById("aiInput");
const aiMessages = document.getElementById("aiMessages");

aiBtn.onclick = () => aiPanel.classList.toggle("hidden");
aiClose.onclick = () => aiPanel.classList.add("hidden");

aiSend.onclick = () => {
  if (!aiInput.value) return;

  aiMessages.innerHTML += `<div><b>You:</b> ${aiInput.value}</div>`;
  aiMessages.innerHTML += `<div><b>Instructor:</b> Focus on the lesson concept and apply it step-by-step.</div>`;

  aiInput.value = "";
  aiMessages.scrollTop = aiMessages.scrollHeight;
};
</script>

</body>
</html>
