<!DOCTYPE html>
<html lang="en">
<head>

<script>
(function () {
  const confirmed = sessionStorage.getItem("bsaConfirmed");
  if (!confirmed) {
    window.location.href = "confirmation.html";
  }
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSA Student Dashboard</title>

<link rel="stylesheet" href="styles.css">

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #243245;
}

/* HEADER */
.topbar {
  background: #1d3f7a;
  color: white;
  padding: 16px 24px;
}

.topbar-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 50px;
  height: 50px;
  background: white;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-mark img {
  width: 70%;
}

/* LAYOUT */
.container {
  max-width: 1300px;
  margin: auto;
  padding: 24px;
}

/* HERO */
.hero {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}

@media (max-width: 900px) {
  .hero {
    grid-template-columns: 1fr;
  }
}

/* DASHBOARD SPLIT */
.dashboard-layout {
  display: grid;
  grid-template-columns: 3fr 1fr;
  gap: 20px;
  margin-top: 20px;
}

@media (max-width: 1000px) {
  .dashboard-layout {
    grid-template-columns: 1fr;
  }
}

/* PANELS */
.panel {
  background: white;
  padding: 20px;
  border-radius: 12px;
}

/* LESSON GRID */
.lesson-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap: 16px;
  margin-top: 10px;
}

/* LESSON CARD */
.lesson-card {
  position: relative;
}

.lesson-num {
  width: 32px;
  height: 32px;
  background: #1d3f7a;
  color: white;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}

/* STATUS BADGE */
.status-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
}

.passed { background: #d4edda; color: #1e7e34; }
.inprogress { background: #fff3cd; color: #856404; }
.locked { background: #e2e3e5; color: #6c757d; }

/* BUTTONS */
.btn {
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  display: inline-block;
  cursor: pointer;
  border: none;
}

.btn-blue { background: #1d3f7a; color: white; }
.btn-outline { border: 1px solid #1d3f7a; color: #1d3f7a; }
.btn-disabled { background: #ccc; cursor: not-allowed; }

.lesson-actions {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* AI PANEL */
.ai-card {
  height: 500px;
  display: flex;
  flex-direction: column;
}

.ai-chat {
  flex: 1;
  overflow-y: auto;
  margin: 10px 0;
  font-size: 14px;
}

.ai-msg {
  margin-bottom: 10px;
  padding: 8px;
  border-radius: 8px;
}

.ai-user {
  background: #1d3f7a;
  color: white;
  text-align: right;
}

.ai-bot {
  background: #f1f3f5;
}

.ai-input-wrap {
  display: flex;
  gap: 6px;
}

.ai-input-wrap input {
  flex: 1;
  padding: 8px;
}

.ai-input-wrap button {
  background: #c89b2c;
  border: none;
  padding: 8px 12px;
  cursor: pointer;
}

</style>

</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <img src="./images/bsa-logo.png">
      </div>
      <div>
        <h2>Broussard Shooting Academy</h2>
        <small>Student Training Dashboard</small>
      </div>
    </div>
    <button class="btn btn-blue" id="logoutBtn">Logout</button>
  </div>
</header>

<main class="container">

<section class="hero">
  <div class="panel">
    <h2 id="welcomeLine"></h2>
    <p>
      Complete each lesson, pass each quiz, complete scenarios, and pass the final evaluation before live training.
    </p>
  </div>

  <div class="panel">
    <p><strong id="progressLabel"></strong></p>
    <p id="studentStatus"></p>
    <p id="studentEmailLabel"></p>
  </div>
</section>

<div class="dashboard-layout">

  <!-- LESSONS -->
  <div>
    <h3>Lesson Dashboard</h3>
    <section class="lesson-grid" id="lessonGrid"></section>
  </div>

  <!-- AI PANEL -->
  <aside>
    <div class="panel ai-card">
      <h4>Training Assistant</h4>
      <div id="aiChat" class="ai-chat"></div>

      <div class="ai-input-wrap">
        <input id="aiInput" type="text" placeholder="Ask a question..." />
        <button id="aiSend">Send</button>
      </div>
    </div>
  </aside>

</div>

</main>

<script src="data.js"></script>

<script type="module">
import {
  requireLogin,
  refreshCurrentStudentFromFirestore,
  getCurrentStudent,
  overallProgress,
  allLessonsComplete,
  getLessonProgress,
  lessonStatus,
  logout
} from "./app.js";

requireLogin();

const student = (await refreshCurrentStudentFromFirestore()) || getCurrentStudent();
const prog = overallProgress(student);

document.getElementById("welcomeLine").textContent =
  (student?.name || "Student") + ", continue your training.";

document.getElementById("studentEmailLabel").textContent = student?.email || "";

document.getElementById("progressLabel").textContent =
  prog.passed + " / " + prog.total + " Lessons Passed";

document.getElementById("studentStatus").textContent =
  allLessonsComplete(student) ? "Ready for Live Range" : "In Progress";

const grid = document.getElementById("lessonGrid");

window.LESSONS.forEach((lesson) => {

  const progress = getLessonProgress(lesson.id, student);

  let locked = lesson.id > 1 && !getLessonProgress(lesson.id - 1, student)?.quizPassed;

  const statusClass = locked ? "locked" : progress.quizPassed ? "passed" : "inprogress";
  const statusText = locked ? "Locked" : progress.quizPassed ? "Passed" : "In Progress";

  const card = document.createElement("article");
  card.className = "panel lesson-card";

  card.innerHTML = `
    <span class="status-badge ${statusClass}">${statusText}</span>
    <div class="lesson-num">${lesson.id}</div>
    <h4>${lesson.title}</h4>
    <p>${lesson.summary}</p>

    <div class="lesson-actions">
      ${
        locked
          ? `<span class="btn btn-disabled">Complete Previous Lesson</span>`
          : `<a class="btn btn-blue" href="lesson.html?lesson=${lesson.id}">
              ${progress.contentViewed ? "Continue Lesson" : "Start Lesson"}
            </a>`
      }
    </div>
  `;

  grid.appendChild(card);
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  sessionStorage.removeItem("bsaConfirmed");
  logout();
  window.location.href = "login.html";
});
</script>

<script type="module">
import { askAssistant } from "./teacher-assistant.js";

const chat = document.getElementById("aiChat");
const input = document.getElementById("aiInput");
const btn = document.getElementById("aiSend");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "ai-msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

btn.addEventListener("click", async () => {
  const question = input.value.trim();
  if (!question) return;

  addMessage(question, "ai-user");
  input.value = "";

  const response = await askAssistant(question);
  addMessage(response, "ai-bot");
});

input.addEventListener("keypress", (e) => {
  if (e.key === "Enter") btn.click();
});
</script>

</body>
</html>
