<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Student Dashboard</title>
  <link rel="stylesheet" href="css/portal.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: white;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: #111827;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .logout-btn {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: #f59e0b;
      color: #111827;
      font-weight: 700;
      cursor: pointer;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .label {
      color: #cbd5e1;
      font-size: 0.92rem;
      margin-bottom: 6px;
    }

    .value {
      font-size: 1.15rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <script type="module" src="js/auth-guard.js"></script>

  <div class="topbar">
    <h1>BSA Student Dashboard</h1>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="label">Student ID</div>
      <div class="value" id="studentIdValue"></div>
    </div>

    <div class="card">
      <div class="label">Access Code</div>
      <div class="value" id="accessCodeValue"></div>
    </div>

    <div class="card">
      <div class="label">Tier</div>
      <div class="value" id="tierValue"></div>
    </div>

    <div class="card">
      <div class="label">Portal Status</div>
      <div class="value" id="statusValue"></div>
    </div>
  </div>

  <script type="module">
    document.getElementById("studentIdValue").textContent = sessionStorage.getItem("bsaStudentId") || "N/A";
    document.getElementById("accessCodeValue").textContent = sessionStorage.getItem("bsaAccessCode") || "N/A";
    document.getElementById("tierValue").textContent = sessionStorage.getItem("bsaTier") || "N/A";
    document.getElementById("statusValue").textContent = sessionStorage.getItem("bsaPortalStatus") || "N/A";

    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem("bsaAccessCode");
      sessionStorage.removeItem("bsaStudentId");
      sessionStorage.removeItem("bsaTier");
      sessionStorage.removeItem("bsaPortalStatus");
      sessionStorage.removeItem("bsaLoggedIn");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
