<script type="module">

import {
  requireLogin,
  refreshCurrentStudentFromFirestore,
  getCurrentStudent,
  overallProgress,
  allLessonsComplete,
  getLessonProgress,
  lessonStatus,
  logout
} from "./app.js";

/* =========================
   SAFE BOOT (CANNOT BREAK)
========================= */

let student = null;

try {
  requireLogin();

  try {
    student = await refreshCurrentStudentFromFirestore();
  } catch (e) {
    console.warn("Firestore failed → fallback", e);
  }

  if (!student) {
    student = getCurrentStudent();
  }

  if (!student) {
    console.error("No student found — stopping render safely");
    return;
  }

} catch (err) {
  console.error("Login/init failed:", err);
  return;
}

/* =========================
   DASHBOARD RENDER
========================= */

const prog = overallProgress(student);

document.getElementById("welcomeLine").textContent =
  `${student.name || "Student"}, continue your training and complete your certification path.`;

document.getElementById("studentEmailLabel").textContent =
  student.email || "—";

document.getElementById("progressLabel").textContent =
  `${prog.passed} / ${prog.total} Lessons Passed`;

document.getElementById("progressBar").style.width =
  `${prog.percent}%`;

document.getElementById("studentStatus").textContent =
  allLessonsComplete(student)
    ? "Online Prerequisite Completed – Cleared for Live Range"
    : "In Progress";

/* =========================
   LESSON CARDS
========================= */

const grid = document.getElementById("lessonGrid");

window.LESSONS.forEach((lesson) => {

  const status = lessonStatus(lesson.id, student);
  const progress = getLessonProgress(lesson.id, student);
  const isFinal = lesson.id === 10;

  const card = document.createElement("article");
  card.className = "panel lesson-card";

  card.innerHTML = `
    <div class="lesson-top">
      <div style="display:flex;gap:12px;">
        <div class="lesson-num ${isFinal ? 'final-lesson' : ''}">
          ${isFinal ? '★' : lesson.id}
        </div>
        <div>
          <h4>${lesson.title}</h4>
          <p>${lesson.summary}</p>
        </div>
      </div>
      <span class="status ${status.className}">${status.label}</span>
    </div>

    <div class="lesson-meta">
      <span class="chip">Time: ${lesson.estTime}</span>
      <span class="chip">Quiz</span>
      <span class="chip">Scenarios</span>
      ${isFinal ? `<span class="chip critical">Final Evaluation</span>` : ""}
      ${progress.attempts ? `<span class="chip">Attempts: ${progress.attempts}</span>` : ""}
    </div>

    <div class="lesson-actions">

      ${
        status.locked
          ? `<span class="btn btn-blue btn-disabled">Locked</span>`
          : `<a class="btn btn-blue" href="lesson.html?lesson=${lesson.id}">
               ${progress.contentViewed ? "Continue Lesson" : "Start Lesson"}
             </a>`
      }

      ${
        !status.locked && progress.contentViewed
          ? `<a class="btn btn-outline" href="scenario.html?lesson=${lesson.id}">Scenarios</a>`
          : ""
      }

      ${
        !status.locked && progress.scenarioCompleted
          ? `<a class="btn btn-outline" href="quiz.html?lesson=${lesson.id}">
               ${isFinal ? "Start Evaluation" : "Take Quiz"}
             </a>`
          : ""
      }

      ${
        progress.quizPassed
          ? `<a class="btn btn-outline" href="quiz.html?lesson=${lesson.id}&review=1">
               Review Answers
             </a>`
          : ""
      }

    </div>
  `;

  grid.appendChild(card);
});

/* =========================
   LOGOUT
========================= */

document.getElementById("logoutBtn").onclick = () => {
  logout();
  window.location.href = "login.html";
};

/* =========================
   AI TOGGLE (FIXED)
========================= */

const aiBtn = document.getElementById("aiToggleBtn");
const aiPanel = document.getElementById("aiPanel");
const aiClose = document.getElementById("aiClose");

if (aiBtn && aiPanel) {

  aiBtn.addEventListener("click", () => {
    aiPanel.classList.toggle("hidden");
  });

  if (aiClose) {
    aiClose.addEventListener("click", () => {
      aiPanel.classList.add("hidden");
    });
  }
}

</script>
