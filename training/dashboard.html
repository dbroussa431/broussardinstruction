<!DOCTYPE html>
<html lang="en">
<head>

<script>
(function () {
  const confirmed = sessionStorage.getItem("bsaConfirmed");
  if (!confirmed) {
    window.location.href = "confirmation.html";
  }
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSA Student Dashboard</title>

<link rel="stylesheet" href="styles.css">

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #243245;
}

/* HEADER */
.topbar {
  background: #1d3f7a;
  color: white;
  padding: 16px 24px;
}

.topbar-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 50px;
  height: 50px;
  background: white;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-mark img {
  width: 70%;
}

/* LAYOUT */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 24px;
}

.hero {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}

@media (max-width: 900px) {
  .hero {
    grid-template-columns: 1fr;
  }
}

.panel {
  background: white;
  padding: 20px;
  border-radius: 12px;
}

/* LESSON GRID */
.lesson-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap: 16px;
  margin-top: 20px;
}

/* LESSON CARD */
.lesson-card {
  position: relative;
}

.lesson-card h4 {
  margin: 0 0 8px 0;
}

/* STATUS BADGE (FIX) */
.status-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
}

/* COLORS */
.passed {
  background: #d4edda;
  color: #1e7e34;
}

.inprogress {
  background: #fff3cd;
  color: #856404;
}

.locked {
  background: #e2e3e5;
  color: #6c757d;
}

/* LESSON NUMBER */
.lesson-num {
  width: 32px;
  height: 32px;
  background: #1d3f7a;
  color: white;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}

/* BUTTONS */
.btn {
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  display: inline-block;
  cursor: pointer;
  border: none;
}

.btn-blue {
  background: #1d3f7a;
  color: white;
}

.btn-outline {
  border: 1px solid #1d3f7a;
  color: #1d3f7a;
  background: transparent;
}

.btn-disabled {
  background: #ccc;
  cursor: not-allowed;
}

.lesson-actions {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

</style>

</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <img src="./images/bsa-logo.png">
      </div>
      <div>
        <h2>Broussard Shooting Academy</h2>
        <small>Student Training Dashboard</small>
      </div>
    </div>
    <button class="btn btn-blue" id="logoutBtn">Logout</button>
  </div>
</header>

<main class="container">

<section class="hero">
  <div class="panel">
    <h2 id="welcomeLine"></h2>
    <p>
      Complete each lesson, pass each quiz, complete scenarios, and pass the final evaluation before live training.
    </p>
  </div>

  <div class="panel">
    <p><strong id="progressLabel"></strong></p>
    <p id="studentStatus"></p>
    <p id="studentEmailLabel"></p>
  </div>
</section>

<h3>Lesson Dashboard</h3>
<section class="lesson-grid" id="lessonGrid"></section>

</main>

<script src="data.js"></script>

<script type="module">
import {
  requireLogin,
  refreshCurrentStudentFromFirestore,
  getCurrentStudent,
  overallProgress,
  allLessonsComplete,
  getLessonProgress,
  lessonStatus,
  logout
} from "./app.js";

requireLogin();

const student = (await refreshCurrentStudentFromFirestore()) || getCurrentStudent();
const prog = overallProgress(student);

document.getElementById("welcomeLine").textContent =
  (student?.name || "Student") + ", continue your training.";

document.getElementById("studentEmailLabel").textContent =
  student?.email || "";

document.getElementById("progressLabel").textContent =
  prog.passed + " / " + prog.total + " Lessons Passed";

document.getElementById("studentStatus").textContent =
  allLessonsComplete(student) ? "Ready for Live Range" : "In Progress";

const grid = document.getElementById("lessonGrid");

window.LESSONS.forEach((lesson) => {

  const progress = getLessonProgress(lesson.id, student);
  const status = lessonStatus(lesson.id, student);

  let locked = false;

  if (lesson.id > 1) {
    const prev = getLessonProgress(lesson.id - 1, student);
    if (!prev || !prev.quizPassed) {
      locked = true;
    }
  }

  const card = document.createElement("article");
  card.className = "panel lesson-card";

  const statusClass = locked
    ? "locked"
    : progress.quizPassed
    ? "passed"
    : "inprogress";

  const statusText = locked
    ? "Locked"
    : progress.quizPassed
    ? "Passed"
    : "In Progress";

  card.innerHTML = `
    <span class="status-badge ${statusClass}">${statusText}</span>

    <div class="lesson-num">${lesson.id}</div>

    <h4>${lesson.title}</h4>
    <p>${lesson.summary}</p>

    <div class="lesson-actions">

      ${
        locked
          ? `<span class="btn btn-disabled">Complete Previous Lesson</span>`
          : `<a class="btn btn-blue" href="lesson.html?lesson=${lesson.id}">
              ${progress.contentViewed ? "Continue Lesson" : "Start Lesson"}
            </a>`
      }

      ${
        !locked && progress.contentViewed
          ? `<a class="btn btn-outline" href="scenario.html?lesson=${lesson.id}">
              Scenarios
            </a>`
          : ""
      }

      ${
        !locked && progress.scenarioCompleted
          ? `<a class="btn btn-outline" href="quiz.html?lesson=${lesson.id}">
              Take Quiz
            </a>`
          : ""
      }

    </div>
  `;

  grid.appendChild(card);
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  sessionStorage.removeItem("bsaConfirmed");
  logout();
  window.location.href = "login.html";
});
</script>

</body>
</html>
