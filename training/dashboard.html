<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | Broussard Shooting Academy</title>
  <link rel="stylesheet" href="css/portal.css" />
</head>
<body class="portal-shell">
  <header class="portal-header">
    <img src="images/bsa-logo.png" alt="Broussard Shooting Academy" class="portal-logo">
    <div class="portal-header-title">
      <h1>Broussard Shooting Academy Training Portal</h1>
      <p>Online Prerequisite Dashboard</p>
    </div>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </header>

  <main class="portal-main">
    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="stat-label">Student</div>
        <div class="stat-value" id="studentName">—</div>
        <div id="studentEmail" style="margin-top:8px;color:#667085;"></div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Access Type</div>
        <div class="stat-value" id="studentType">—</div>
        <div id="studentCode" style="margin-top:8px;color:#667085;"></div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Lesson Progress</div>
        <div class="stat-value" id="lessonCount">0 / 8</div>
        <div class="progress-wrap">
          <div class="progress-bar"><span id="progressFill" style="width:0%"></span></div>
        </div>
      </div>
    </div>

    <div class="top-actions">
      <button class="portal-btn" onclick="window.location.href='lesson.html?lesson=1'">Start / Continue Training</button>
      <button class="secondary-btn" onclick="window.location.href='complete.html'">Completion Status</button>
    </div>

    <div class="lesson-list" id="lessonList"></div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
