<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSA Lesson Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark"><img src="assets/logo.png" alt="BSA logo"></div>
        <div><h1>Broussard Shooting Academy</h1><p>Lesson Quiz</p></div>
      </div>
      <div class="top-actions">
        <a class="btn btn-light" href="dashboard.html">Dashboard</a>
        <a class="btn btn-light" id="backToLesson" href="#">Lesson</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel content-card logo-watermark">
      <span class="eyebrow">20-question randomized quiz</span>
      <h2 id="quizTitle"></h2>
      <p class="muted">Students must score at least <strong>80%</strong> to pass this lesson and unlock the next one. Any failed attempt triggers a 24-hour lock on that lesson with a visible countdown.</p>
      <div id="warningBox" class="notice warn hidden" style="margin-bottom:16px"></div>
      <div id="quizWrap"></div>
      <div class="lesson-actions" id="submitWrap"><button class="btn btn-gold" id="submitQuizBtn">Submit Quiz</button></div>
      <div id="resultsWrap" class="hidden"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    BSA.requireLogin();
    const lessonId = Number(BSA.qs('lesson') || 1);
    const reviewOnly = BSA.qs('review') === '1';
    const lesson = LESSONS.find(l => l.id === lessonId) || LESSONS[0];

    const lockRemaining = BSA.getLockRemainingMs(lesson.id);
    if (lockRemaining > 0) {
      document.querySelector('main').innerHTML = `
        <section class="panel content-card">
          <span class="eyebrow">24-hour review lock</span>
          <h2>${lesson.id}. ${lesson.title} — Temporarily Locked</h2>
          <p class="muted">This lesson is locked for 24 hours after a failed quiz attempt. Please re-read your lesson material and come back when the countdown ends.</p>
          <div class="notice warn" id="lockBox">Unlocks in ${BSA.formatCountdown(lockRemaining)}</div>
          <div class="lesson-actions">
            <a class="btn btn-blue" href="dashboard.html">Back to Dashboard</a>
          </div>
        </section>`;
      const lockBox = document.getElementById('lockBox');
      setInterval(() => {
        const ms = BSA.getLockRemainingMs(lesson.id);
        if (ms <= 0) {
          window.location.reload();
          return;
        }
        lockBox.textContent = `Unlocks in ${BSA.formatCountdown(ms)}`;
      }, 1000);
      throw new Error('Lesson temporarily locked');
    }

    const progress = BSA.getLessonProgress(lesson.id);
    document.getElementById('quizTitle').textContent = `${lesson.id}. ${lesson.title} — Quiz`;
    document.getElementById('backToLesson').href = `lesson.html?lesson=${lesson.id}`;

    const attempts = BSA.getAttemptCount(lesson.id);
    if (attempts >= 1 && !reviewOnly) {
      const warning = document.getElementById('warningBox');
      warning.classList.remove('hidden');
      warning.textContent = attempts >= 2
        ? 'You have already failed this lesson more than once. Re-read the chapter summary carefully before another attempt.'
        : 'Review the chapter summary carefully before retaking this quiz.';
    }

    const wrap = document.getElementById('quizWrap');
    const resultsWrap = document.getElementById('resultsWrap');
    const submitWrap = document.getElementById('submitWrap');

    if (reviewOnly) {
      submitWrap.classList.add('hidden');
      if (!progress.quizDetails || !progress.quizDetails.length) {
        resultsWrap.innerHTML = '<div class="banner retake">No prior quiz review was found for this lesson yet.</div>';
      } else {
        const missed = progress.quizDetails.filter(x => !x.correct);
        let html = `<div class="banner pass">Last recorded score: ${progress.quizScore || 0}%</div>`;
        html += missed.length
          ? '<h3>Missed Questions Review</h3>'
          : '<h3>No missed questions on the last passing attempt.</h3>';
        missed.forEach((item, i) => {
          html += `<div class="review-item"><p><strong>${i+1}. ${item.q}</strong></p><p>Your answer: ${item.userAnswer ?? 'No answer selected'}</p><p>Correct answer: ${item.correctAnswer}</p><p>${item.explanation}</p></div>`;
        });
        html += `<div class="lesson-actions"><a class="btn btn-blue" href="dashboard.html">Back to Dashboard</a>${lesson.id < LESSONS.length ? `<a class="btn btn-outline" href="lesson.html?lesson=${lesson.id+1}">Open Next Lesson</a>` : `<a class="btn btn-outline" href="complete.html">Go to Final Step</a>`}</div>`;
        resultsWrap.innerHTML = html;
      }
      resultsWrap.classList.remove('hidden');
    } else {
      const bank = QUIZ_BANK[lesson.id] || [];
      const pickedQuestions = BSA.randomSample(bank, 20);
      if (!pickedQuestions.length) {
        wrap.innerHTML = '<div class="notice bad">No quiz bank found for this lesson yet.</div>';
        submitWrap.classList.add('hidden');
      } else {
        const list = document.createElement('div');
        list.className = 'q-list';
        pickedQuestions.forEach((item, idx) => {
          const card = document.createElement('div');
          card.className = 'question-card';
          card.dataset.index = idx;
          const answers = item.type === 'tf'
            ? ['True', 'False']
            : item.choices;
          card.innerHTML = `<h4>${idx + 1}. ${item.q}</h4>`;
          const options = document.createElement('div');
          options.className = 'options';
          answers.forEach((choice, choiceIndex) => {
            const option = document.createElement('button');
            option.type = 'button';
            option.className = 'option';
            option.textContent = `${String.fromCharCode(65 + choiceIndex)}. ${choice}`;
            option.addEventListener('click', () => {
              card.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
              option.classList.add('selected');
              card.dataset.answer = choiceIndex;
            });
            options.appendChild(option);
          });
          card.appendChild(options);
          list.appendChild(card);
        });
        wrap.appendChild(list);

        document.getElementById('submitQuizBtn').addEventListener('click', () => {
          let correct = 0;
          const details = [];
          document.querySelectorAll('.question-card').forEach((card, idx) => {
            const q = pickedQuestions[idx];
            const picked = card.dataset.answer === undefined ? null : Number(card.dataset.answer);
            const answers = q.type === 'tf' ? ['True', 'False'] : q.choices;
            const normalizedCorrectIndex = q.type === 'tf'
              ? (q.answer === true ? 0 : 1)
              : Number(q.answer);
            const isCorrect = picked === normalizedCorrectIndex;
            if (isCorrect) correct++;
            details.push({
              q: q.q,
              correct: isCorrect,
              userAnswer: picked === null ? 'No answer selected' : answers[picked],
              correctAnswer: answers[normalizedCorrectIndex],
              explanation: q.explanation || ''
            });
          });

          const score = Math.round((correct / pickedQuestions.length) * 100);
          BSA.recordQuizResult(lesson.id, score, details);
          wrap.classList.add('hidden');
          submitWrap.classList.add('hidden');
          const missed = details.filter(x => !x.correct);
          const passed = score >= BSA.PASSING_SCORE;
          const nextHref = lesson.id < LESSONS.length ? `lesson.html?lesson=${lesson.id + 1}` : 'complete.html';
          const nextLabel = lesson.id < LESSONS.length ? 'Open Next Lesson' : 'Go to Final Step';

          let html = `<div class="banner ${passed ? 'pass' : 'retake'}">${passed ? `Passed — ${score}%` : `Retake Required — ${score}%`} </div>`;
          html += `<div class="results-grid"><div class="panel result-card"><div class="score-card"><div class="score-circle" style="--pct:${score}%"><span>${score}%</span></div><div><h3 style="margin:0 0 8px">Quiz Result</h3><p class="muted" style="margin:0">${correct} out of ${pickedQuestions.length} correct.</p></div></div></div><div class="panel result-card"><h3 style="margin-top:0">What happens next?</h3><p class="muted">${passed ? 'This lesson is now passed and the next lesson is unlocked.' : 'Students scoring below 80% trigger a 24-hour review lock. They should re-read the lesson gist and return after the countdown ends.'}</p><div class="lesson-actions"><a class="btn btn-outline" href="lesson.html?lesson=${lesson.id}">Re-read Lesson</a>${passed ? `<a class="btn btn-blue" href="${nextHref}">${nextLabel}</a>` : `<a class="btn btn-gold" href="dashboard.html">Back to Dashboard</a>`}</div>${passed ? '' : `<div class="notice warn" style="margin-top:14px">Lesson locked for 24 hours. Countdown begins now.</div>`}</div></div>`;
          html += '<h3 style="margin-top:22px">Missed Questions Review</h3>';
          if (!missed.length) {
            html += '<div class="review-item"><p><strong>No missed questions.</strong> Great work.</p></div>';
          } else {
            missed.forEach((item, i) => {
              html += `<div class="review-item"><p><strong>${i+1}. ${item.q}</strong></p><p>Your answer: ${item.userAnswer}</p><p>Correct answer: ${item.correctAnswer}</p><p>${item.explanation}</p></div>`;
            });
          }
          resultsWrap.innerHTML = html;
          resultsWrap.classList.remove('hidden');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    }
  </script>
</body>
</html>
