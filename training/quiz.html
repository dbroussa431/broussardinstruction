<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSA Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png"></div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Lesson Quiz</p>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn btn-light" href="dashboard.html">Dashboard</a>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel content-card">
    <h2>Quiz</h2>
    <p class="muted">80% required. Critical mistakes will fail automatically.</p>

    <div id="quizContainer"></div>
    <button id="submitBtn" class="btn btn-gold">Submit Quiz</button>

    <div id="result" style="margin-top:20px;"></div>
  </div>
</main>

<script src="data.js"></script>

<script type="module">
import { requireLogin, markLessonComplete } from "./app.js";

requireLogin();

const lessonId = Number(new URLSearchParams(window.location.search).get("lesson") || 1);
const container = document.getElementById("quizContainer");
const resultDiv = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

// 🔥 TRACK USED QUESTIONS (session-based)
let usedQuestions = JSON.parse(sessionStorage.getItem("usedQuestions_" + lessonId) || "[]");

// 🔥 RANDOMIZER WITH NO REPEAT
function getQuestions(pool, count = 7) {

  let available = pool.filter(q => !usedQuestions.includes(q.q));

  // If exhausted, reset
  if (available.length < count) {
    usedQuestions = [];
    available = pool;
  }

  const selected = [...available].sort(() => Math.random() - 0.5).slice(0, count);

  // Save used
  selected.forEach(q => usedQuestions.push(q.q));
  sessionStorage.setItem("usedQuestions_" + lessonId, JSON.stringify(usedQuestions));

  return selected;
}

// 🔥 LOAD
const pool = window.QUIZ_BANK?.[lessonId] || [];
const questions = getQuestions(pool);

// 🔥 CHOICE HANDLER
function getChoices(q) {
  if (q.type === "tf") return ["True", "False"];
  if (q.choices) return q.choices;
  if (q.options) return q.options;
  return [];
}

// 🔥 RENDER
questions.forEach((q, i) => {

  const block = document.createElement("div");
  block.style.marginBottom = "20px";

  const question = document.createElement("p");
  question.innerHTML = `<strong>${i + 1}. ${q.q}</strong>`;
  block.appendChild(question);

  const choices = getChoices(q);

  choices.forEach((choice, j) => {
    const label = document.createElement("label");
    label.style.display = "block";

    const input = document.createElement("input");
    input.type = "radio";
    input.name = "q" + i;
    input.value = j;

    label.appendChild(input);
    label.append(" " + choice);

    block.appendChild(label);
  });

  container.appendChild(block);
});

// 🔥 SUBMIT WITH WEAK AREA TRACKING
submitBtn.onclick = () => {

  let correct = 0;
  let criticalFail = false;

  let weakAreas = {
    law: 0,
    safety: 0,
    mental: 0
  };

  questions.forEach((q, i) => {

    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    if (!selected) return;

    const val = Number(selected.value);

    let isCorrect = false;

    if (q.type === "tf") {
      const expected = q.answer === true ? 0 : 1;
      isCorrect = (val === expected);
    } else {
      isCorrect = (val === q.answer);
    }

    // 🔴 TRACK WEAK AREAS
    if (!isCorrect) {
      if (q.category === "law") weakAreas.law++;
      if (q.category === "safety") weakAreas.safety++;
      if (q.category === "mental") weakAreas.mental++;

      // 🔥 CRITICAL FAIL RULE
      if (q.critical === true) {
        criticalFail = true;
      }
    } else {
      correct++;
    }

  });

  const percent = Math.round((correct / questions.length) * 100);

  console.log("Weak Areas:", weakAreas);

  if (percent >= 80 && !criticalFail) {

    resultDiv.innerHTML = `<strong style="color:green;">Passed (${percent}%)</strong>`;

    markLessonComplete(lessonId);

    setTimeout(() => window.location.href = "dashboard.html", 1500);

  } else {

    let reason = "";

    if (criticalFail) {
      reason = "<br><span style='color:red;'>Critical mistake — review required.</span>";
    }

    resultDiv.innerHTML = `<strong style="color:red;">Failed (${percent}%) — Try Again</strong>${reason}`;

  }
};

</script>

</body>
</html>
