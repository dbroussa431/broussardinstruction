<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSA Quiz</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    /* 🔥 LOCAL UI FIX (no global breakage) */

    .quiz-question {
      background: #f9fafb;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #e5e7eb;
    }

    .quiz-question h4 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .quiz-option {
      display: block;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .quiz-option:hover {
      background: #eef2f7;
    }

    .quiz-option input {
      margin-right: 8px;
    }

    #submitBtn {
      margin-top: 15px;
    }

    #result {
      font-size: 18px;
      font-weight: 600;
    }

  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png"></div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Lesson Quiz</p>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn btn-light" href="dashboard.html">Dashboard</a>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel content-card">
    <h2>Quiz</h2>
    <p class="muted">80% required to pass. Critical mistakes will fail automatically.</p>

    <div id="quizContainer"></div>

    <button id="submitBtn" class="btn btn-gold">Submit Quiz</button>

    <div id="result"></div>
  </div>
</main>

<script src="data.js"></script>

<script type="module">

import { requireLogin } from "./app.js";

requireLogin();

const lessonId = Number(new URLSearchParams(window.location.search).get("lesson") || 1);

const container = document.getElementById("quizContainer");
const resultDiv = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

// 🔥 CERTIFICATION ENGINE
function getCertifiedQuestions(pool) {

  const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

  const law = pool.filter(q => q.category === "law");
  const mental = pool.filter(q => q.category === "mental");
  const safety = pool.filter(q => q.category === "safety");

  let selected = [];

  if (law.length) selected.push(...shuffle(law).slice(0, 2));
  if (mental.length) selected.push(...shuffle(mental).slice(0, 2));
  if (safety.length) selected.push(...shuffle(safety).slice(0, 1));

  const remaining = pool.filter(q => !selected.includes(q));

  selected = [...selected, ...shuffle(remaining).slice(0, 3)];

  return shuffle(selected).slice(0, 8);
}

// 🔥 LOAD QUESTIONS
const pool = window.QUIZ_BANK?.[lessonId] || [];
const questions = getCertifiedQuestions(pool);

// 🔴 SAFETY
if (!questions.length) {
  container.innerHTML = "<p>No quiz questions found.</p>";
}

// 🔥 SUPPORT ALL TYPES
function getChoices(q) {
  if (q.type === "tf") return ["True", "False"];
  if (q.choices) return q.choices;
  if (q.options) return q.options;
  return [];
}

// 🔥 RENDER (UI FIXED)
questions.forEach((q, i) => {

  const block = document.createElement("div");
  block.className = "quiz-question";

  const question = document.createElement("h4");
  question.textContent = `${i + 1}. ${q.q}`;
  block.appendChild(question);

  const choices = getChoices(q);

  choices.forEach((choice, j) => {

    const label = document.createElement("label");
    label.className = "quiz-option";

    const input = document.createElement("input");
    input.type = "radio";
    input.name = "q" + i;
    input.value = j;

    label.appendChild(input);
    label.append(choice);

    block.appendChild(label);

  });

  container.appendChild(block);
});

// 🔥 SUBMIT
submitBtn.onclick = () => {

  let correct = 0;
  let criticalFail = false;

  questions.forEach((q, i) => {

    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    if (!selected) return;

    const val = Number(selected.value);

    let isCorrect = false;

    if (q.type === "tf") {
      const expected = q.answer === true ? 0 : 1;
      isCorrect = (val === expected);
    } else {
      isCorrect = (val === q.answer);
    }

    if (isCorrect) {
      correct++;
    } else if (q.critical === true) {
      criticalFail = true;
    }

  });

  const percent = Math.round((correct / questions.length) * 100);

  if (percent >= 80 && !criticalFail) {

    resultDiv.innerHTML = `<span style="color:green;">Passed (${percent}%)</span>`;

    setTimeout(() => window.location.href = "dashboard.html", 1500);

  } else {

    let msg = `Failed (${percent}%)`;

    if (criticalFail) {
      msg += " — Critical mistake";
    }

    resultDiv.innerHTML = `<span style="color:red;">${msg}</span>`;
  }
};

</script>

</body>
</html>
