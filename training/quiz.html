<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSA Final Evaluation</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png"></div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Final Evaluation</p>
      </div>
    </div>

    <div class="top-actions">
      <a class="btn btn-light" href="dashboard.html">Dashboard</a>
    </div>
  </div>
</header>

<main class="container">

<section class="panel content-card">

<span class="eyebrow">FINAL EVALUATION</span>
<h2 id="quizTitle"></h2>

<div class="callout warn">
<strong>This is your final validation.</strong>
<ul>
<li>Minimum passing score: 80%</li>
<li>Incorrect decisions may result in failure</li>
<li>This determines readiness for live training</li>
</ul>
</div>

<form id="quizForm"></form>

<div class="lesson-actions">
<button class="btn btn-blue" type="submit" form="quizForm">Submit</button>
<a class="btn btn-outline" id="backToLesson">Back to Lesson</a>
</div>

</section>

</main>

<script src="data.js"></script>

<script type="module">

const params = new URLSearchParams(window.location.search);
const lessonId = Number(params.get("lesson"));

if (!lessonId) {
  window.location.href = "dashboard.html";
}

document.getElementById("backToLesson").href =
  `lesson.html?lesson=${lessonId}`;

// load lesson
const lesson = window.LESSONS.find(l => l.id === lessonId);

const form = document.getElementById("quizForm");
document.getElementById("quizTitle").textContent =
  `${lesson.id}. ${lesson.title}`;

lesson.quiz.forEach((q, i) => {

  const block = document.createElement("div");
  block.className = "quiz-block";

  block.innerHTML = `
    <h4>${i+1}. ${q.question}</h4>
    ${q.options.map((opt, idx) => `
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${opt}
      </label>
    `).join("")}
  `;

  form.appendChild(block);
});

form.addEventListener("submit", (e) => {
  e.preventDefault();

  let correct = 0;

  lesson.quiz.forEach((q, i) => {
    const selected = form.querySelector(`input[name=q${i}]:checked`);
    if (selected && Number(selected.value) === q.answer) correct++;
  });

  const score = Math.round((correct / lesson.quiz.length) * 100);

  alert(`Score: ${score}%`);

  if (score >= 80) {
    alert("PASS");
    window.location.href = "dashboard.html";
  } else {
    alert("FAIL");
  }
});

</script>

</body>
</html>
