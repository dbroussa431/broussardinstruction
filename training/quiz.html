<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Quiz</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --muted: #cbd5e1;
      --gold: #f59e0b;
      --green: #22c55e;
      --red: #ef4444;
      --border: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
      color: var(--text);
    }

    .wrap {
      width: min(950px, 92%);
      margin: 0 auto;
      padding: 24px 0 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.08);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .panel {
      background: rgba(17,24,39,0.88);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
    }

    .eyebrow {
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .muted {
      color: var(--muted);
      line-height: 1.6;
    }

    .question {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-top: 18px;
    }

    .question h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.05rem;
    }

    .option {
      display: block;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0;
      cursor: pointer;
    }

    .option input {
      margin-right: 8px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    button, .btn-link {
      appearance: none;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.96rem;
    }

    .btn-primary {
      background: var(--gold);
      color: #111827;
    }

    .btn-secondary {
      background: transparent;
      color: #fff;
      border: 1px solid var(--border);
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      display: none;
    }

    .pass {
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.35);
    }

    .fail {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1>Broussard Shooting Academy</h1>
        <p>Lesson Quiz</p>
      </div>

      <div class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a id="backToScenario" href="scenario.html?lesson=1">Back to Scenario</a>
      </div>
    </div>

    <section class="panel">
      <div class="eyebrow" id="lessonLabel">Lesson 1</div>
      <h2>Quiz</h2>
      <p class="muted">
        Score at least 80% to pass this lesson. This version accepts both the old and new URL flow.
      </p>

      <form id="quizForm">
        <div id="questionList"></div>

        <div class="actions">
          <button type="submit" class="btn-primary">Submit Quiz</button>
          <a class="btn-link btn-secondary" href="dashboard.html">Return to Dashboard</a>
        </div>
      </form>

      <div class="result" id="resultBox"></div>
    </section>
  </div>

  <script>
    function getLessonNumber() {
      const params = new URLSearchParams(window.location.search);

      let lesson =
        params.get("lesson") ||
        params.get("module") ||
        params.get("id");

      if (!lesson && window.location.hash) {
        const match = window.location.hash.match(/lesson-(\d+)/i);
        if (match) lesson = match[1];
      }

      if (!lesson) {
        lesson = localStorage.getItem("currentLesson");
      }

      if (!lesson) lesson = "1";

      lesson = String(lesson).replace(/[^\d]/g, "");

      if (!lesson || Number(lesson) < 1 || Number(lesson) > 8) {
        lesson = "1";
      }

      localStorage.setItem("currentLesson", lesson);
      return lesson;
    }

    const QUIZ_BANK = {
      1: [
        {
          q: "What is the first thing you should do when handling any firearm?",
          options: [
            "Assume it is unloaded",
            "Verify its condition safely",
            "Pull the trigger in a safe place",
            "Set it down and walk away"
          ],
          answer: 1
        },
        {
          q: "Where should the muzzle be pointed?",
          options: [
            "In a safe direction",
            "At the ground no matter what",
            "At the target only when loaded",
            "Anywhere if the safety is on"
          ],
          answer: 0
        },
        {
          q: "When should your finger be on the trigger?",
          options: [
            "Any time you pick up the firearm",
            "Only when your sights are on target and you have decided to shoot",
            "Whenever the firearm is pointed down",
            "During storage"
          ],
          answer: 1
        },
        {
          q: "If another person hands you a firearm, what should you do?",
          options: [
            "Assume they checked it already",
            "Immediately holster it",
            "Verify it is clear yourself",
            "Dry fire it"
          ],
          answer: 2
        },
        {
          q: "Safe handling rules apply:",
          options: [
            "Only at the range",
            "Only when loaded",
            "At all times",
            "Only during class"
          ],
          answer: 2
        }
      ],
      2: [
        { q: "When uncertain about restrictions, you should:", options: ["Guess", "Check the rules first", "Ask a stranger only", "Ignore the issue"], answer: 1 },
        { q: "Emotional control matters because:", options: ["It has no effect", "Handling firearms while upset is unsafe", "It only matters at home", "It replaces training"], answer: 1 },
        { q: "Legal awareness should be:", options: ["Occasional", "Ignored", "Kept current", "Used only after a problem"], answer: 2 },
        { q: "Verbal conflict alone means:", options: ["Automatic deadly threat", "Nothing ever matters", "You still assess actual threat", "You should display your firearm"], answer: 2 },
        { q: "A responsible choice when unsure is to:", options: ["Pause and verify", "Rush forward", "Let others decide", "Skip training"], answer: 0 }
      ],
      3: [
        { q: "Firearms should be stored to prevent:", options: ["Cleaning", "Lawful ownership", "Unauthorized access", "Training"], answer: 2 },
        { q: "A visible firearm left in a vehicle is:", options: ["Best practice", "A theft risk", "Required", "Safer than locking it up"], answer: 1 },
        { q: "Children and unsecured firearms are:", options: ["A serious safety concern", "Not a concern if warned once", "Unrelated", "Only a range issue"], answer: 0 },
        { q: "Secure storage matters most when:", options: ["Guests or children may access the area", "Nobody ever visits", "At the range only", "Only during transport"], answer: 0 },
        { q: "A safer vehicle storage choice is:", options: ["Plain view", "Loose under the seat", "Secured discreetly", "On the passenger seat"], answer: 2 }
      ],
      4: [
        { q: "Awareness helps you:", options: ["Notice issues early", "Eliminate all risk", "Ignore surroundings", "Avoid all training"], answer: 0 },
        { q: "Creating distance during uncertainty can:", options: ["Worsen every situation", "Provide time and options", "Replace judgment", "Cause automatic panic"], answer: 1 },
        { q: "Looking at your phone in a vulnerable area:", options: ["Improves awareness", "Can reduce awareness", "Guarantees safety", "Is recommended"], answer: 1 },
        { q: "Good awareness is:", options: ["Paranoia", "Constant screaming", "Calm observation", "A legal defense"], answer: 2 },
        { q: "Safer positioning means:", options: ["Standing trapped", "Keeping better options and visibility", "Moving into blind spots", "Ignoring exits"], answer: 1 }
      ],
      5: [
        { q: "If safe escape is available, the preferred choice is often to:", options: ["Escalate", "Disengage", "Taunt", "Corner yourself"], answer: 1 },
        { q: "An insult by itself is:", options: ["Always deadly force justification", "Not the same as an immediate deadly threat", "A reason to draw", "A command to fight"], answer: 1 },
        { q: "Defensive judgment should be:", options: ["Emotional", "Measured and lawful", "Based on pride", "Random"], answer: 1 },
        { q: "Good decision-making starts with:", options: ["Ego", "Assessment", "Anger", "Guessing"], answer: 1 },
        { q: "Avoiding escalation is generally:", options: ["Weakness", "Often the smarter choice", "Illegal", "Impossible"], answer: 1 }
      ],
      6: [
        { q: "After an incident, a major priority is:", options: ["Posting online", "Calling emergency services when appropriate", "Hiding evidence", "Leaving silently"], answer: 1 },
        { q: "Stress can affect:", options: ["Only vision", "Only hearing", "Perception and judgment", "Nothing"], answer: 2 },
        { q: "Training matters because:", options: ["It helps under stress", "It removes all stress", "It makes mistakes impossible", "It replaces law"], answer: 0 },
        { q: "A serious incident should be treated:", options: ["Like a joke", "With discipline and care", "As entertainment", "As social content"], answer: 1 },
        { q: "Decision-making under pressure is:", options: ["Always perfect", "Often harder than expected", "Unimportant", "Only for police"], answer: 1 }
      ],
      7: [
        { q: "Worn support gear should be:", options: ["Ignored", "Fixed or replaced", "Used until failure", "Shared widely"], answer: 1 },
        { q: "Maintenance matters because:", options: ["Reliability matters", "Looks matter more than function", "It is optional for defensive use", "It prevents all legal issues"], answer: 0 },
        { q: "A carry setup should be:", options: ["Unstable", "Unsafe", "Secure and functional", "Random"], answer: 2 },
        { q: "Before relying on equipment, you should:", options: ["Inspect it", "Assume it works", "Avoid practice", "Never test anything"], answer: 0 },
        { q: "Poor gear can create:", options: ["No problems", "Potential safety and access problems", "Automatic skill", "Better concealment every time"], answer: 1 }
      ],
      8: [
        { q: "Final review before live training is:", options: ["Helpful", "Pointless", "Forbidden", "Only for beginners"], answer: 0 },
        { q: "Weak areas should be:", options: ["Ignored", "Reviewed", "Hidden", "Deleted"], answer: 1 },
        { q: "Live review is for:", options: ["Skipping fundamentals", "Building on preparation", "Replacing all responsibility", "Avoiding qualification"], answer: 1 },
        { q: "Questions during live review are:", options: ["A problem", "A good opportunity to learn", "Proof of failure", "Not allowed"], answer: 1 },
        { q: "Completing online work should lead into:", options: ["Nothing", "Proper live follow-through", "Automatic certificate printing", "No further steps"], answer: 1 }
      ]
    };

    const lesson = Number(getLessonNumber());
    const quizQuestions = QUIZ_BANK[lesson] || QUIZ_BANK[1];

    document.getElementById("lessonLabel").textContent = `Lesson ${lesson}`;
    document.getElementById("backToScenario").href = `scenario.html?lesson=${lesson}`;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const randomizedQuestions = shuffle(quizQuestions).slice(0, 5);

    function renderQuiz() {
      const list = document.getElementById("questionList");

      list.innerHTML = randomizedQuestions.map((item, qIndex) => {
        const options = item.options.map((option, oIndex) => `
          <label class="option">
            <input type="radio" name="q${qIndex}" value="${oIndex}">
            ${option}
          </label>
        `).join("");

        return `
          <div class="question">
            <h3>${qIndex + 1}. ${item.q}</h3>
            ${options}
          </div>
        `;
      }).join("");
    }

    document.getElementById("quizForm").addEventListener("submit", function (e) {
      e.preventDefault();

      let correct = 0;

      for (let i = 0; i < randomizedQuestions.length; i++) {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (!selected) {
          alert("Please answer every question before submitting.");
          return;
        }

        if (Number(selected.value) === randomizedQuestions[i].answer) {
          correct++;
        }
      }

      const percent = Math.round((correct / randomizedQuestions.length) * 100);
      const passed = percent >= 80;

      const resultBox = document.getElementById("resultBox");
      resultBox.style.display = "block";
      resultBox.className = `result ${passed ? "pass" : "fail"}`;
      resultBox.innerHTML = `
        <strong>${passed ? "Passed" : "Not Passed Yet"}</strong><br>
        Score: ${correct}/${randomizedQuestions.length} (${percent}%)
        ${passed ? "<br>This lesson is now marked passed." : "<br>Please review and retake the quiz."}
      `;

      localStorage.setItem(`bsa_quiz_score_${lesson}`, String(percent));
      localStorage.setItem(`bsa_quiz_passed_${lesson}`, passed ? "true" : "false");
    });

    renderQuiz();
  </script>
</body>
</html>
