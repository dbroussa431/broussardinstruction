<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSA Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png"></div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p id="quizHeader"></p>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn btn-light" href="dashboard.html">Dashboard</a>
    </div>
  </div>
</header>

<main class="container">

<section class="panel content-card" id="quizPanel">

  <h2 id="quizTitle"></h2>
  <p id="quizDescription" class="muted"></p>

  <div id="rereadNotice" class="notice warn hidden"></div>

  <div id="quizWrap"></div>

  <div class="lesson-actions">
    <button class="btn btn-blue" id="submitQuizBtn">Submit Quiz</button>
    <a class="btn btn-outline" id="backLessonLink">Back to Lesson</a>
  </div>

</section>

<section id="resultPanel" class="hidden"></section>

</main>

<script src="data.js"></script>

<script type="module">

import {
  PASSING_SCORE,
  requireLogin,
  refreshCurrentStudentFromFirestore,
  getCurrentStudent,
  getLessonProgress,
  getAttemptCount,
  getQuizQuestionsForLesson,
  recordQuizResult,
  recordFinalEvaluation,
  clearActiveQuiz
} from "./app.js";

requireLogin();

const student = (await refreshCurrentStudentFromFirestore()) || getCurrentStudent();
const lessonId = Number(new URLSearchParams(window.location.search).get("lesson") || 1);
const reviewMode = new URLSearchParams(window.location.search).get("review") === "1";

const lesson = window.LESSONS.find(l => l.id === lessonId);
const progress = getLessonProgress(lessonId, student);
const isFinal = lessonId === 10;

// HEADER
document.getElementById("quizHeader").textContent =
  isFinal ? "FINAL EVALUATION" : "Lesson Quiz";

document.getElementById("quizTitle").textContent =
  `${lesson.id}. ${lesson.title}`;

document.getElementById("quizDescription").textContent =
  isFinal
    ? "Critical mistakes result in automatic failure."
    : "Score 80% or higher to pass.";

document.getElementById("backLessonLink").href =
  `lesson.html?lesson=${lesson.id}`;

// ATTEMPTS NOTICE
const attemptCount = getAttemptCount(lessonId, student);
if (attemptCount >= 1) {
  document.getElementById("rereadNotice").textContent =
    attemptCount >= 2
      ? "You should re-read the lesson before retrying."
      : "Score below 80% requires retake.";
  document.getElementById("rereadNotice").classList.remove("hidden");
}

// REVIEW MODE
if (reviewMode && progress.quizDetails) {
  renderResults(progress.quizScore, progress.quizDetails, true, false);
  document.getElementById("quizPanel").classList.add("hidden");
} else {

  clearActiveQuiz(lessonId);

  const startedAt = Date.now();
  const questions = getQuizQuestionsForLesson(lessonId, 20);
  const wrap = document.getElementById("quizWrap");

  questions.forEach((q, i) => {

    const block = document.createElement("div");
    block.className = "question-block";

    block.innerHTML = `<h4>${i + 1}. ${q.q}</h4>`;

    const options = document.createElement("div");

    const choices = q.type === "tf" ? ["True", "False"] : q.choices;

    choices.forEach((choice, idx) => {

      const label = document.createElement("label");

      label.innerHTML = `
        <input type="radio" name="q_${i}" value="${q.type === "tf" ? (idx === 0 ? "true" : "false") : idx}">
        ${choice}
      `;

      options.appendChild(label);
    });

    block.appendChild(options);
    wrap.appendChild(block);
  });

  document.getElementById("submitQuizBtn").addEventListener("click", async () => {

    let correct = 0;
    let criticalFail = false;
    const details = [];

    questions.forEach((q, i) => {

      const selected = document.querySelector(`input[name="q_${i}"]:checked`);
      let isCorrect = false;
      let yourAnswer = "No answer";
      let correctAnswer = "";

      if (q.type === "tf") {
        correctAnswer = q.answer ? "True" : "False";
        if (selected) {
          yourAnswer = selected.value === "true" ? "True" : "False";
          isCorrect = String(q.answer) === selected.value;
        }
      } else {
        correctAnswer = q.choices[q.answer];
        if (selected) {
          yourAnswer = q.choices[Number(selected.value)];
          isCorrect = Number(selected.value) === q.answer;
        }
      }

      if (isCorrect) correct++;
      if (!isCorrect && q.critical) criticalFail = true;

      details.push({
        question: q.q,
        yourAnswer,
        correctAnswer,
        explanation: q.explanation,
        isCorrect
      });
    });

    const score = Math.round((correct / questions.length) * 100);
    const elapsed = Math.round((Date.now() - startedAt) / 1000);

    if (isFinal) {
      await recordFinalEvaluation(lessonId, score, details, elapsed, { criticalFail });
    } else {
      await recordQuizResult(lessonId, score, details, elapsed);
    }

    renderResults(score, details, false, criticalFail);
  });
}

// RESULTS
function renderResults(score, details, reviewOnly, criticalFail) {

  const passed = score >= PASSING_SCORE && !criticalFail;

  const resultPanel = document.getElementById("resultPanel");
  resultPanel.classList.remove("hidden");

  const missed = details.filter(d => !d.isCorrect);

  resultPanel.innerHTML = `
    <div class="panel result-card">

      <div class="banner ${passed ? "pass" : "retake"}">
        ${criticalFail ? "CRITICAL FAIL" : passed ? "PASS" : "FAIL"} — ${score}%
      </div>

      <div class="lesson-actions">
        ${passed
          ? `<a class="btn btn-blue" href="dashboard.html">Return to Dashboard</a>`
          : `<a class="btn btn-danger" href="quiz.html?lesson=${lessonId}">Retake</a>`
        }

        <a class="btn btn-outline" href="lesson.html?lesson=${lessonId}">Review Lesson</a>
      </div>

    </div>

    <div class="panel result-card">
      <h3>Review</h3>

      ${
        missed.length
          ? missed.map(m => `
            <div class="review-item">
              <p><strong>${m.question}</strong></p>
              <p>Your Answer: ${m.yourAnswer}</p>
              <p>Correct: ${m.correctAnswer}</p>
              <p>${m.explanation || ""}</p>
            </div>
          `).join("")
          : "<p>No missed questions.</p>"
      }

    </div>
  `;
}

</script>

</body>
</html>
