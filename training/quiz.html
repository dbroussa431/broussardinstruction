<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Training Portal | Lesson Quiz</title>
  <link rel="stylesheet" href="css/portal.css" />
  <script src="js/app.js"></script>
</head>
<body>
  <div class="portal-shell">
    <header class="portal-header">
      <h1>Broussard Shooting Academy</h1>
      <p>Lesson Quiz</p>
    </header>

    <main class="page-wrap">
      <section class="page-card">
        <h2 class="page-title">Lesson Quiz</h2>
        <p id="quizNotice" class="notice info">Loading quiz...</p>
        <div id="quizWrap"></div>

        <div class="page-actions">
          <div class="page-actions-left">
            <a class="btn btn-dark" id="backToLesson" href="lesson.html?lesson=1">Back to Lesson</a>
          </div>
          <div class="page-actions-right">
            <button class="btn btn-green" id="startQuizBtn">Start Quiz</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    async function initQuizPage() {
      const quizWrap = document.getElementById("quizWrap");
      const startQuizBtn = document.getElementById("startQuizBtn");

      const lessonId = window.BSA.qs("lesson");
      const lesson = window.LESSONS.find(l => l.id === Number(lessonId));

      if (!lesson) {
        document.getElementById("quizNotice").innerHTML = `Lesson not found.`;
        return;
      }

      document.getElementById("quizNotice").innerHTML = `Loading quiz for ${lesson.title}...`;

      startQuizBtn.addEventListener("click", () => {
        window.location.href = `quiz-questions.html?lesson=${lessonId}`;
      });
    }

    window.addEventListener("DOMContentLoaded", initQuizPage);
  </script>
</body>
</html>
