<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSA Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png"></div>
      <div><h1>Broussard Shooting Academy</h1><p>Lesson Quiz</p></div>
    </div>
    <a class="btn btn-light" href="dashboard.html">Dashboard</a>
  </div>
</header>

<main class="container">

<section class="panel content-card" id="quizPanel">

<span class="eyebrow">Final Evaluation • Pass at 80%</span>
<h2 id="quizTitle"></h2>

<p class="muted">
This evaluation measures legal understanding and responsible decision-making.
</p>

<div id="quizWrap"></div>

<div class="lesson-actions">
<button class="btn btn-blue" id="submitQuizBtn">Submit Quiz</button>
<a class="btn btn-outline" id="backLessonLink">Back to Lesson</a>
</div>

</section>

<section id="resultPanel" class="results-grid hidden"></section>

</main>

<script src="data.js"></script>

<script type="module">

import {
  PASSING_SCORE,
  requireLogin,
  refreshCurrentStudentFromFirestore,
  getCurrentStudent,
  getLessonProgress,
  getAttemptCount,
  getQuizQuestionsForLesson,
  recordQuizResult,
  clearActiveQuiz
} from "./app.js";

requireLogin();

const student = (await refreshCurrentStudentFromFirestore()) || getCurrentStudent();

const lessonId = Number(new URLSearchParams(window.location.search).get("lesson") || 1);

const lesson = window.LESSONS.find(l => l.id === lessonId);

document.getElementById("quizTitle").textContent =
  `${lesson.id}. ${lesson.title} — Final Evaluation`;

document.getElementById("backLessonLink").href =
  `lesson.html?lesson=${lesson.id}`;

// ===============================
// 🔥 LESSON 8 OVERRIDE (CRITICAL)
// ===============================

let selectedQuestions = [];

if (lessonId === 8) {

  selectedQuestions = [

    {
      q: "When is deadly force legally justified?",
      choices: [
        "To protect property",
        "When verbally threatened",
        "When facing an immediate serious threat",
        "Anytime you feel unsafe"
      ],
      answer: 2,
      explanation: "Deadly force requires an immediate and serious threat to life."
    },

    {
      q: "Carrying under the influence becomes illegal at what BAC?",
      choices: [".08", ".05", ".10", "Any amount"],
      answer: 1,
      explanation: ".05 BAC meets the legal definition of being under the influence."
    },

    {
      q: "What is the most common type of firearm death?",
      choices: ["Homicide", "Accidental", "Suicide", "Unknown"],
      answer: 2,
      explanation: "Most firearm deaths are suicides, not homicides."
    },

    {
      q: "What is the safest response during uncertainty?",
      choices: [
        "Act immediately",
        "Show force",
        "Create distance and assess",
        "Engage quickly"
      ],
      answer: 2,
      explanation: "Distance and assessment reduce unnecessary escalation."
    },

    {
      q: "Does property theft justify deadly force?",
      choices: ["Yes", "No"],
      answer: 1,
      explanation: "Deadly force is not justified for property alone."
    },

    {
      q: "What is the best response to a mental health crisis involving firearms?",
      choices: [
        "Ignore it",
        "Encourage firearm access",
        "Create distance from firearms",
        "Wait for it to pass"
      ],
      answer: 2,
      explanation: "Time and distance significantly reduce risk."
    },

    {
      q: "Where is carry prohibited?",
      choices: [
        "Public sidewalks",
        "Courthouses",
        "Parking lots",
        "Private homes"
      ],
      answer: 1,
      explanation: "Courthouses are prohibited locations."
    },

    {
      q: "When approached by law enforcement while carrying:",
      choices: [
        "Say nothing",
        "Notify immediately",
        "Hide weapon",
        "Leave"
      ],
      answer: 1,
      explanation: "You must notify law enforcement."
    }

  ];

} else {

  clearActiveQuiz(lessonId);
  selectedQuestions = getQuizQuestionsForLesson(lessonId, 20);

}

// ===============================
// 🔵 RENDER QUIZ
// ===============================

const quizWrap = document.getElementById("quizWrap");

selectedQuestions.forEach((q, i) => {

  const card = document.createElement("div");
  card.className = "question-card";

  card.innerHTML = `<h4>${i + 1}. ${q.q}</h4>`;

  const options = document.createElement("div");

  q.choices.forEach((choice, j) => {

    const label = document.createElement("label");

    label.innerHTML = `
      <input type="radio" name="q_${i}" value="${j}">
      ${choice}
    `;

    options.appendChild(label);

  });

  card.appendChild(options);
  quizWrap.appendChild(card);

});

// ===============================
// 🔵 SUBMIT
// ===============================

document.getElementById("submitQuizBtn").onclick = async () => {

  let correct = 0;
  const details = [];

  selectedQuestions.forEach((q, i) => {

    const picked = document.querySelector(`input[name=q_${i}]:checked`);
    const selected = picked ? Number(picked.value) : -1;

    const isCorrect = selected === q.answer;

    if (isCorrect) correct++;

    details.push({
      question: q.q,
      yourAnswer: selected >= 0 ? q.choices[selected] : "None",
      correctAnswer: q.choices[q.answer],
      explanation: q.explanation,
      isCorrect
    });

  });

  const score = Math.round((correct / selectedQuestions.length) * 100);

  await recordQuizResult(lessonId, score, details);

  renderResults(score, details);

};

// ===============================
// 🔵 RESULTS
// ===============================

function renderResults(score, details) {

  const passed = score >= PASSING_SCORE;

  const panel = document.getElementById("resultPanel");

  panel.classList.remove("hidden");

  panel.innerHTML = `
    <div class="panel">
      <h3>${passed ? "PASS" : "FAIL"} — ${score}%</h3>
      ${passed ? "<p>You are ready.</p>" : "<p>Retake required.</p>"}
    </div>
  `;

}

</script>

</body>
</html>
