<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Quiz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>Broussard Shooting Academy</h1>
    <p>Quiz Time</p>
  </header>

  <main class="wrap">
    <section class="card">
      <h2 id="quizTitle">Quiz Title</h2>
      <div id="quizQuestions"></div>
      <button id="submitQuizBtn">Submit Quiz</button>
    </section>

    <section class="actions">
      <button id="logoutBtn">Logout</button>
    </section>
  </main>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    async function loadQuiz(quizId) {
      const quizRef = doc(db, "quizzes", quizId);
      const quizSnap = await getDoc(quizRef);

      if (quizSnap.exists()) {
        const quizData = quizSnap.data();
        document.getElementById("quizTitle").textContent = quizData.title;

        // Render the questions here
        const questions = quizData.questions;
        const quizQuestionsDiv = document.getElementById("quizQuestions");
        questions.forEach((q, idx) => {
          const questionDiv = document.createElement("div");
          questionDiv.innerHTML = `
            <p>${q.text}</p>
            <input type="radio" name="question${idx}" value="1"> ${q.options[0]}<br>
            <input type="radio" name="question${idx}" value="2"> ${q.options[1]}<br>
            <input type="radio" name="question${idx}" value="3"> ${q.options[2]}<br>
          `;
          quizQuestionsDiv.appendChild(questionDiv);
        });
      }
    }

    document.getElementById("submitQuizBtn").onclick = () => {
      window.location.href = "results.html";  // Redirect to quiz results page
    };

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("currentStudent");
      window.location.href = "index.html";
    };

    loadQuiz(1);  // Load quiz 1 for example
  </script>
</body>
</html>
