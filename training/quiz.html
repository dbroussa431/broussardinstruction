<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Quiz</title>
  <link rel="stylesheet" href="./css/portal.css" />
</head>
<body class="portal-shell">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="./dashboard.html">
        <img src="./images/bsa-logo.png" alt="Broussard Shooting Academy" class="site-logo" />
        <div class="site-brand-copy">
          <h1>Broussard Shooting Academy</h1>
          <p>Private Student Portal • Online Prerequisite Training</p>
        </div>
      </a>

      <nav class="site-nav" aria-label="Student portal navigation">
        <a class="nav-link" href="./dashboard.html">Dashboard</a>
        <a class="nav-link active" href="./quiz.html">Quiz</a>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </nav>
    </div>
  </header>

  <main class="content-page">
    <div class="content-stack">
      <section class="content-card hero">
        <a class="back-link" id="lessonBackLink" href="./lesson.html">← Back to Lesson</a>
        <div class="content-kicker">LESSON QUIZ</div>
        <h1 id="quizTitle" class="content-title">Loading quiz...</h1>
        <p class="content-summary">
          Answer 20 randomized questions. A score of 80% or higher is required to pass the lesson.
        </p>
      </section>

      <section class="content-card">
        <div class="quiz-topbar">
          <div id="quizProgress" class="quiz-progress">Question 1 of 20</div>
          <div id="quizScorePreview" class="quiz-score-preview">Correct So Far: 0</div>
        </div>
      </section>

      <section id="questionCard" class="question-card"></section>

      <section id="quizResultCard" class="quiz-result-card" hidden></section>
    </div>
  </main>

  <script type="module">
    import {
      getCurrentStudent,
      clearCurrentStudent,
      refreshCurrentStudentFromFirestore,
      getLessonProgress,
      saveStudentProgress
    } from "./js/app.js";

    import { LESSONS } from "./js/data.js";

    const logoutBtn = document.getElementById("logoutBtn");
    const lessonBackLink = document.getElementById("lessonBackLink");
    const quizTitle = document.getElementById("quizTitle");
    const quizProgress = document.getElementById("quizProgress");
    const quizScorePreview = document.getElementById("quizScorePreview");
    const questionCard = document.getElementById("questionCard");
    const quizResultCard = document.getElementById("quizResultCard");

    function redirectLogin() {
      window.location.href = "./index.html";
    }

    function getLessonNumber() {
      const params = new URLSearchParams(window.location.search);
      return Number(params.get("lesson") || 1);
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function pickQuizArray(lesson) {
      if (Array.isArray(lesson.quizBank)) return lesson.quizBank;
      if (Array.isArray(lesson.questionBank)) return lesson.questionBank;
      if (Array.isArray(lesson.questions)) return lesson.questions;
      if (Array.isArray(lesson.quizQuestions)) return lesson.quizQuestions;
      return [];
    }

    function normalizeQuestion(item) {
      const rawChoices = Array.isArray(item.choices) ? item.choices : [];

      if (item.type === "tf" && rawChoices.length === 0) {
        return {
          question: item.question || item.q || "Question text missing.",
          choices: ["True", "False"],
          correct: item.correct === true || item.answer === true ? 0 : 1,
          explanation: item.explanation || ""
        };
      }

      return {
        question: item.question || item.q || "Question text missing.",
        choices: rawChoices,
        correct: Number(item.correct ?? item.answer ?? 0),
        explanation: item.explanation || ""
      };
    }

    async function init() {
      let student = getCurrentStudent();
      if (!student) {
        redirectLogin();
        return;
      }

      student = await refreshCurrentStudentFromFirestore();
      if (!student) {
        redirectLogin();
        return;
      }

      const lessonNumber = getLessonNumber();
      const lesson = LESSONS.find(l => Number(l.lessonNumber) === lessonNumber);

      if (!lesson) {
        quizTitle.textContent = "Quiz not found";
        questionCard.innerHTML = "<p>Lesson data is missing for this quiz.</p>";
        return;
      }

      const rawQuizBank = pickQuizArray(lesson);

      if (!rawQuizBank.length) {
        quizTitle.textContent = "Quiz not found";
        questionCard.innerHTML = `
          <p>Quiz data is missing for this lesson.</p>
          <p style="margin-top:10px; color:#69788f;">
            The lesson was found, but no usable quiz bank field was detected.
          </p>
        `;
        return;
      }

      lessonBackLink.href = `./lesson.html?lesson=${lessonNumber}`;
      quizTitle.textContent = `${lesson.title} — Quiz`;

      const priorProgress = getLessonProgress(student, lessonNumber);
      const questions = shuffle(rawQuizBank).slice(0, 20).map(normalizeQuestion);

      let currentIndex = 0;
      let correctCount = 0;
      const attempts = Number(priorProgress.attempts || 0) + 1;
      const missedQuestions = [];

      function renderQuestion() {
        const item = questions[currentIndex];

        quizProgress.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
        quizScorePreview.textContent = `Correct So Far: ${correctCount}`;

        const answers = item.choices.map((choice, index) => `
          <button class="answer-btn" data-index="${index}">
            ${choice}
          </button>
        `).join("");

        questionCard.hidden = false;
        questionCard.innerHTML = `
          <div class="question-number">QUESTION ${currentIndex + 1}</div>
          <h2 class="question-text">${item.question}</h2>
          <div class="answer-list">${answers}</div>
          <div id="questionExplanation" class="explanation-box" hidden></div>
          <div class="quiz-footer">
            <div></div>
            <button id="nextQuestionBtn" class="btn-primary" type="button" disabled>
              ${currentIndex === questions.length - 1 ? "Finish Quiz" : "Next Question"}
            </button>
          </div>
        `;

        const answerButtons = [...questionCard.querySelectorAll(".answer-btn")];
        const explanation = document.getElementById("questionExplanation");
        const nextQuestionBtn = document.getElementById("nextQuestionBtn");
        let answered = false;

        answerButtons.forEach((button) => {
          button.addEventListener("click", () => {
            if (answered) return;
            answered = true;

            const selected = Number(button.dataset.index);
            const isCorrect = selected === item.correct;

            answerButtons.forEach((btn, idx) => {
              btn.disabled = true;
              if (idx === item.correct) btn.classList.add("correct");
              if (idx === selected && !isCorrect) btn.classList.add("incorrect");
              if (idx === selected) btn.classList.add("selected");
            });

            if (isCorrect) {
              correctCount += 1;
            } else {
              missedQuestions.push(item.question);
            }

            quizScorePreview.textContent = `Correct So Far: ${correctCount}`;

            if (item.explanation) {
              explanation.hidden = false;
              explanation.innerHTML = `<strong>Explanation:</strong> ${item.explanation}`;
            } else {
              explanation.hidden = false;
              explanation.innerHTML = `<strong>Review Note:</strong> Revisit the lesson gist and chapter material for the principle behind this question.`;
            }

            nextQuestionBtn.disabled = false;
          });
        });

        nextQuestionBtn.addEventListener("click", async () => {
          if (currentIndex < questions.length - 1) {
            currentIndex += 1;
            renderQuestion();
            return;
          }

          const score = Math.round((correctCount / questions.length) * 100);
          const passed = score >= 80;

          await saveStudentProgress(lessonNumber, {
            attempts,
            quizPassed: passed,
            quizScore: score,
            missedQuestions
          });

          questionCard.hidden = true;
          quizResultCard.hidden = false;
          quizResultCard.innerHTML = `
            <div class="content-kicker">QUIZ COMPLETE</div>
            <h2 class="content-title">Lesson ${lessonNumber} Results</h2>
            <div class="quiz-result-score">${score}%</div>
            <p class="${passed ? "quiz-result-pass" : "quiz-result-fail"}">
              ${passed ? "Passed — lesson unlocked successfully." : "Not yet passing — review the lesson and try again."}
            </p>
            <p class="content-summary">
              ${passed
                ? "Great work. Your lesson has been marked complete."
                : "A score of 80% or higher is required. Review the lesson gist, revisit scenarios, and retake the quiz."}
            </p>
            <div class="content-actions" style="margin-top:18px;">
              <a class="lesson-btn primary" href="./dashboard.html">Return to Dashboard</a>
              <a class="lesson-btn" href="./lesson.html?lesson=${lessonNumber}">Review Lesson</a>
              <a class="lesson-btn" href="./scenario.html?lesson=${lessonNumber}">Review Scenarios</a>
              ${!passed ? `<a class="lesson-btn" href="./quiz.html?lesson=${lessonNumber}">Retake Quiz</a>` : ""}
            </div>
          `;
        });
      }

      renderQuestion();
    }

    logoutBtn?.addEventListener("click", () => {
      clearCurrentStudent();
      redirectLogin();
    });

    init();
  </script>
</body>
</html>
