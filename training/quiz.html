<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSA Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png"></div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Final Evaluation</p>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn btn-light" href="dashboard.html">Dashboard</a>
    </div>
  </div>
</header>

<main class="container">

<section class="panel content-card" id="quizPanel">

  <span class="eyebrow" id="quizHeader"></span>
  <h2 id="quizTitle"></h2>
  <p class="muted" id="quizDescription"></p>

  <div class="notice warn" id="finalNotice">
    <strong>This is your final evaluation.</strong>
    <ul>
      <li>Minimum passing score: 80%</li>
      <li>Critical mistakes may result in failure</li>
      <li>This determines readiness for live training</li>
    </ul>
  </div>

  <div id="quizWrap"></div>

  <div class="lesson-actions">
    <button class="btn btn-blue" id="submitQuizBtn">Submit Evaluation</button>
    <a class="btn btn-outline" id="backLessonLink">Back to Lesson</a>
  </div>

</section>

<section id="resultPanel" class="hidden"></section>

</main>

<script src="data.js"></script>

<script type="module">
import {
  PASSING_SCORE,
  requireLogin,
  refreshCurrentStudentFromFirestore,
  getCurrentStudent,
  getLessonProgress,
  getAttemptCount,
  getQuizQuestionsForLesson,
  recordQuizResult,
  recordFinalEvaluation,
  clearActiveQuiz
} from "./app.js";

import {
  initTracking,
  trackQuizStart,
  trackLessonComplete,
  trackFinalResult,
  trackManualActivity,
  logStage,
  stopTracking
} from "./tracking.js";

requireLogin();

const student = (await refreshCurrentStudentFromFirestore()) || getCurrentStudent();
const lessonId = Number(new URLSearchParams(window.location.search).get("lesson") || 1);
const lesson = window.LESSONS.find(l => l.id === lessonId);

if (!student) {
  window.location.href = "index.html";
  throw new Error("Student session missing");
}

if (!lesson) {
  document.getElementById("quizWrap").innerHTML = "<p>Quiz lesson not found.</p>";
  throw new Error("Quiz lesson missing");
}

// TRACKING START
try {
  initTracking(student.id, lessonId);
  await trackQuizStart();
  await logStage("Quiz Started");
} catch (error) {
  console.error("Quiz tracking init failed:", error);
}

document.getElementById("quizTitle").textContent =
  `${lesson.id}. ${lesson.title} — Final Evaluation`;

document.getElementById("quizHeader").textContent =
  "FINAL EVALUATION • PASS AT 80%";

document.getElementById("quizDescription").textContent =
  "This evaluation measures legal understanding, judgment, and responsibility.";

document.getElementById("backLessonLink").href =
  `lesson.html?lesson=${lesson.id}`;

clearActiveQuiz(lessonId);

const selectedQuestions = getQuizQuestionsForLesson(lessonId, 20);
const quizWrap = document.getElementById("quizWrap");

selectedQuestions.forEach((q, index) => {
  const card = document.createElement("div");
  card.className = "scenario-card";

  const title = document.createElement("h3");
  title.textContent = `${index + 1}. ${q.q}`;

  const answers = document.createElement("div");
  answers.className = "answer-group";

  const choices = q.type === "tf"
    ? ["True", "False"]
    : q.choices;

  choices.forEach((choice, i) => {
    const label = document.createElement("label");
    label.className = "answer-option";

    label.innerHTML = `
      <input type="radio" name="q${index}" value="${q.type === "tf" ? (i === 0 ? "true" : "false") : i}">
      <span>${choice}</span>
    `;

    label.addEventListener("click", async () => {
      answers.querySelectorAll(".answer-option").forEach(el => el.classList.remove("selected"));
      label.classList.add("selected");

      try {
        await trackManualActivity();
      } catch (error) {
        console.error("Quiz answer activity failed:", error);
      }
    });

    answers.appendChild(label);
  });

  card.appendChild(title);
  card.appendChild(answers);
  quizWrap.appendChild(card);
});

document.getElementById("submitQuizBtn").addEventListener("click", async () => {
  let correct = 0;
  let criticalFail = false;
  const details = [];

  selectedQuestions.forEach((q, index) => {
    const picked = document.querySelector(`input[name="q${index}"]:checked`);

    let isCorrect = false;
    let yourAnswer = "No answer";
    let correctAnswer = "";

    if (q.type === "tf") {
      correctAnswer = q.answer ? "True" : "False";
      if (picked) {
        yourAnswer = picked.value === "true" ? "True" : "False";
        isCorrect = String(q.answer) === picked.value;
      }
    } else {
      correctAnswer = q.choices[q.answer];
      if (picked) {
        yourAnswer = q.choices[Number(picked.value)];
        isCorrect = Number(picked.value) === q.answer;
      }
    }

    if (isCorrect) correct++;
    if (!isCorrect && q.critical) criticalFail = true;

    details.push({ question: q.q, yourAnswer, correctAnswer, isCorrect });
  });

  const score = Math.round((correct / selectedQuestions.length) * 100);

  await recordFinalEvaluation(lessonId, score, details, 0, { criticalFail });

  try {
    await trackFinalResult(score >= PASSING_SCORE && !criticalFail ? "passed" : "failed");
    await trackLessonComplete();
    await logStage("Quiz Completed");
  } catch (error) {
    console.error("Final quiz tracking failed:", error);
  }

  renderResults(score, details, criticalFail);
});

function renderResults(score, details, criticalFail) {
  const panel = document.getElementById("resultPanel");
  panel.classList.remove("hidden");

  const passed = score >= PASSING_SCORE && !criticalFail;

  panel.innerHTML = `
    <div class="panel result-card">
      <div class="banner ${passed ? "pass" : "retake"}">
        ${criticalFail ? "CRITICAL FAIL" : passed ? "PASS" : "FAIL"} • ${score}%
      </div>

      <div class="lesson-actions">
        <a class="btn btn-blue" href="dashboard.html">Return to Dashboard</a>
        <a class="btn btn-outline" href="lesson.html?lesson=${lessonId}">Review Lesson</a>
      </div>
    </div>
  `;
}

// ACTIVITY THROTTLE
let activityThrottle = false;

async function handleActivityPing() {
  if (activityThrottle) return;
  activityThrottle = true;

  try {
    await trackManualActivity();
  } catch (error) {
    console.error("Manual quiz activity failed:", error);
  }

  setTimeout(() => {
    activityThrottle = false;
  }, 15000);
}

["click", "keydown", "scroll", "touchstart"].forEach((eventName) => {
  window.addEventListener(eventName, handleActivityPing, { passive: true });
});

window.addEventListener("beforeunload", () => {
  stopTracking();
});
</script>

</body>
</html>
