<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSA Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><img src="./images/bsa-logo.png"></div>
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Lesson Quiz</p>
      </div>
    </div>

    <div class="top-actions">
      <a class="btn btn-light" href="dashboard.html">Dashboard</a>
    </div>
  </div>
</header>

<main class="container">

  <div class="panel content-card">
    <h2 id="quizTitle">Quiz</h2>
    <div id="quizContainer"></div>

    <button id="submitBtn" class="btn btn-gold">Submit Quiz</button>

    <div id="result" style="margin-top:20px;"></div>
  </div>

</main>

<script src="data.js"></script>

<script type="module">

import {
  requireLogin,
  getCurrentStudent,
  markLessonComplete
} from "./app.js";

requireLogin();

const lessonId = Number(new URLSearchParams(window.location.search).get("lesson") || 1);

const container = document.getElementById("quizContainer");
const resultDiv = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

// 🔥 RANDOMIZER (used for ALL lessons)
function getRandomQuestions(pool, min = 6, max = 8) {
  const count = Math.floor(Math.random() * (max - min + 1)) + min;
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// 🔥 LOAD QUESTIONS (ALL lessons randomized)
let questions = getRandomQuestions(window.QUIZ_BANK[lessonId] || []);

// Render questions
questions.forEach((q, i) => {

  const block = document.createElement("div");
  block.style.marginBottom = "20px";

  const question = document.createElement("p");
  question.innerHTML = `<strong>${i + 1}. ${q.q}</strong>`;
  block.appendChild(question);

  q.choices.forEach((choice, j) => {
    const label = document.createElement("label");
    label.style.display = "block";

    const input = document.createElement("input");
    input.type = "radio";
    input.name = "q" + i;
    input.value = j;

    label.appendChild(input);
    label.append(" " + choice);

    block.appendChild(label);
  });

  container.appendChild(block);
});

// Submit logic
submitBtn.onclick = () => {

  let correct = 0;

  questions.forEach((q, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);

    if (selected && Number(selected.value) === q.answer) {
      correct++;
    }
  });

  const percent = Math.round((correct / questions.length) * 100);

  if (percent >= 80) {

    resultDiv.innerHTML = `<strong style="color:green;">Passed (${percent}%)</strong>`;

    markLessonComplete(lessonId);

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1500);

  } else {

    resultDiv.innerHTML = `<strong style="color:red;">Failed (${percent}%) — Try Again</strong>`;

  }
};

</script>

</body>
</html>
