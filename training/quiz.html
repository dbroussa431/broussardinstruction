<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Training Portal | Lesson Quiz</title>
  <link rel="stylesheet" href="css/portal.css" />
</head>
<body>
  <div class="portal-shell">
    <header class="portal-header">
      <div>
        <h1>Broussard Shooting Academy</h1>
        <p>Lesson Quiz</p>
      </div>
      <div class="header-actions">
        <a class="btn btn-dark" href="dashboard.html">Dashboard</a>
        <a class="btn btn-gold" href="lesson.html?lesson=1">Back to Lesson</a>
      </div>
    </header>

    <main class="page-wrap">
      <section class="page-card">
        <h2 class="page-title" id="quizTitle">Lesson Quiz</h2>

        <div id="quizWrap" class="notice info">Loading quiz...</div>

        <div class="page-actions">
          <button class="btn btn-green" id="startQuizBtn" type="button">Start Quiz</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import "/js/app.js";

    window.addEventListener("DOMContentLoaded", async () => {
      const BSA = window.BSA;
      const quizWrap = document.getElementById("quizWrap");
      const startQuizBtn = document.getElementById("startQuizBtn");

      if (!BSA) {
        quizWrap.innerHTML = `<div class="notice bad">Portal logic failed to load.</div>`;
        return;
      }

      const lessonId = new URLSearchParams(window.location.search).get("lesson");
      const lesson = window.LESSONS.find(l => l.id === Number(lessonId));

      if (!lesson) {
        quizWrap.innerHTML = `<div class="notice bad">Lesson not found.</div>`;
        return;
      }

      quizWrap.innerHTML = `
        <h3>Lesson: ${lesson.title}</h3>
        <p>Students must score at least 80% to pass this lesson and unlock the next one.</p>
        <div class="callout">
          <strong>Quiz</strong> for ${lesson.title}
        </div>
      `;

      startQuizBtn.addEventListener("click", () => {
        window.location.href = `quiz-questions.html?lesson=${lesson.id}`;
      });
    });
  </script>
</body>
</html>
