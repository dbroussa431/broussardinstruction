<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>BSA Training Portal | Login</title>
  <link rel="stylesheet" href="/training/css/portal.css">
</head>
<body>
  <div class="portal-shell">
    <header class="portal-header">
      <h1>Broussard Shooting Academy</h1>
      <p>Student Training Portal Login</p>
    </header>

    <main class="page-wrap">
      <section class="page-card">
        <h2 class="page-title">Access Your Training</h2>
        <form id="loginForm">
          <label for="studentEmail">Student Email</label>
          <input type="email" id="studentEmail" placeholder="you@example.com" required />

          <label for="accessCode">Access Code</label>
          <input type="text" id="accessCode" placeholder="Enter Access Code" required />

          <button type="submit" class="btn btn-green">Login to Portal</button>
          <p id="loginMsg" class="notice hidden"></p>
        </form>
      </section>
    </main>
  </div>

  <!-- Firebase + App Logic -->
  <script type="module" src="/training/js/app.js"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('studentEmail').value.trim();
      const code = document.getElementById('accessCode').value.trim();
      const result = await BSA.login(code, email);
      if (!result.ok) {
        document.getElementById('loginMsg').textContent = result.message;
        document.getElementById('loginMsg').classList.remove('hidden');
      } else {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
