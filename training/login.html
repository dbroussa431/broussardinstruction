<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Login | Broussard Shooting Academy</title>
  <link rel="stylesheet" href="./css/portal.css" />
</head>
<body class="portal-shell">
  <main class="portal-login-wrap">
    <section class="portal-login-card">
      <img src="./images/bsa-logo.png" alt="Broussard Shooting Academy" class="portal-logo login-logo">
      <h1>BSA Training Portal</h1>
      <p class="portal-subtext">Sign in to access your training dashboard.</p>

      <form id="loginForm" class="portal-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>

        <button type="submit" class="primary-btn" id="loginBtn">Log In</button>
        <p id="loginMessage" class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
