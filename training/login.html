<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSA Training Portal | Login</title>
  <link rel="stylesheet" href="css/portal.css" />
  <script src="js/app.js"></script>
</head>
<body>
  <div class="portal-shell">
    <header class="portal-header">
      <h1>Broussard Shooting Academy</h1>
      <p>Login to access your course materials</p>
    </header>

    <main class="page-wrap">
      <section class="page-card">
        <h2 class="page-title">Login</h2>
        <form id="loginForm">
          <label for="accessCode">Access Code</label>
          <input type="text" id="accessCode" required />
          <label for="studentName">Student Name</label>
          <input type="text" id="studentName" required />
          <button type="submit" class="btn btn-green">Log in</button>
          <p id="loginMsg" class="notice hidden"></p>
        </form>
      </section>
    </main>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const result = BSA.login(
        document.getElementById('accessCode').value, 
        document.getElementById('studentName').value
      );
      const msg = document.getElementById('loginMsg');
      if (!result.ok) {
        msg.textContent = result.message;
        msg.classList.remove('hidden');
        return;
      }
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
